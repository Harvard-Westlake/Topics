<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGrn" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect width="760" height="440" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">Build the trees yourself, bottom-up, then hash them</text>

  <!-- docs tree -->
  <text x="30" y="74" fill="#3fb950" font-size="12" font-weight="600">1 · THE docs TREE (deepest first)</text>
  <rect x="30" y="84" width="330" height="70" rx="8" fill="#161b22" stroke="#3fb950"/>
  <g font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#e6edf3">
    <text x="44" y="110">blob aaf4c61d… hello.txt</text>
    <text x="44" y="134">blob 7c211433… world.txt</text>
  </g>
  <text x="250" y="134" fill="#8b949e" font-size="10.5">no \n at end</text>
  <line x1="362" y1="119" x2="392" y2="119" stroke="#3fb950" stroke-width="3" marker-end="url(#arrowGrn)"/>
  <rect x="398" y="84" width="332" height="70" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="412" y="110" fill="#e6edf3" font-size="11.5" font-family="Menlo, Consolas, monospace">d5ff240dd607e36048326aaf7982a025debb0cd7</text>
  <text x="412" y="134" fill="#3fb950" font-size="12" font-weight="600">✓ the docs tree's name in git/objects/</text>

  <!-- root tree -->
  <text x="30" y="186" fill="#3fb950" font-size="12" font-weight="600">2 · THE tree-test TREE (uses docs's hash)</text>
  <rect x="30" y="196" width="330" height="70" rx="8" fill="#161b22" stroke="#3fb950"/>
  <g font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#e6edf3">
    <text x="44" y="222">tree d5ff240d… docs</text>
    <text x="44" y="246">blob 3add7b96… notes.txt</text>
  </g>
  <line x1="362" y1="231" x2="392" y2="231" stroke="#3fb950" stroke-width="3" marker-end="url(#arrowGrn)"/>
  <rect x="398" y="196" width="332" height="70" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="412" y="222" fill="#e6edf3" font-size="11.5" font-family="Menlo, Consolas, monospace">54c35b48b2551e71b9bc43f0d44264807fbf6cc9</text>
  <text x="412" y="246" fill="#3fb950" font-size="12" font-weight="600">✓ the root · scratch.txt is not in it</text>

  <!-- near misses -->
  <text x="30" y="298" fill="#f85149" font-size="12" font-weight="600">NEAR-MISSES FOR THE docs TREE</text>
  <rect x="30" y="308" width="340" height="52" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="44" y="330" fill="#e6edf3" font-size="12">extra \n after the last line</text>
  <text x="44" y="350" fill="#f85149" font-size="11.5" font-family="Menlo, Consolas, monospace">✗ aa4c9c79…3e21</text>
  <rect x="390" y="308" width="340" height="52" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="404" y="330" fill="#e6edf3" font-size="12">full paths instead of final names</text>
  <text x="404" y="350" fill="#f85149" font-size="11.5" font-family="Menlo, Consolas, monospace">✗ 04886484…3422</text>

  <!-- footer -->
  <rect x="30" y="378" width="700" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="406" fill="#8b949e" font-size="12">printf '…\n…' | shasum hashes the exact text. A wrong docs hash also makes the root hash wrong.</text>
</svg>

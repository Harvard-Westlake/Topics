<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
  </defs>
  <rect width="760" height="420" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">Map each Part 3 milestone to the method that does it</text>

  <!-- source file -->
  <text x="30" y="76" fill="#8b949e" font-size="12" font-weight="600">THEIR CODE · Git.java</text>
  <rect x="30" y="86" width="230" height="226" rx="8" fill="#161b22" stroke="#30363d"/>
  <g font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3">
    <text x="46" y="118">main(String[] args)</text>
    <text x="46" y="158">add(String path)</text>
    <text x="46" y="198">createTree(list, dir)</text>
    <text x="46" y="238">createTreeFromIndex()</text>
    <text x="46" y="278" fill="#f85149">listFiles()  ← red flag</text>
  </g>
  <text x="46" y="134" fill="#8b949e" font-size="11">empty? → add Verify.java</text>
  <text x="46" y="294" fill="#8b949e" font-size="11">reads the folder, not the index</text>

  <!-- arrows -->
  <line x1="262" y1="154" x2="318" y2="128" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlu)"/>
  <line x1="262" y1="194" x2="318" y2="194" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlu)"/>
  <line x1="262" y1="234" x2="318" y2="260" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlu)"/>

  <!-- milestone table -->
  <text x="324" y="76" fill="#8b949e" font-size="12" font-weight="600">YOUR FEATURE MAP</text>
  <rect x="324" y="96" width="406" height="64" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="340" y="120" fill="#79c0ff" font-size="13" font-weight="700">GP-3.1 · index stores relative paths</text>
  <text x="340" y="144" fill="#8b949e" font-size="11.5">writes &lt;hash&gt; &lt;path/to/file&gt; · skips duplicates · replaces modified</text>
  <rect x="324" y="166" width="406" height="64" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="340" y="190" fill="#79c0ff" font-size="13" font-weight="700">GP-3.2 · one directory's tree</text>
  <text x="340" y="214" fill="#8b949e" font-size="11.5">direct children only · blob/tree · hash · final name · returns hash</text>
  <rect x="324" y="236" width="406" height="64" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="340" y="260" fill="#79c0ff" font-size="13" font-weight="700">GP-3.3 · root tree from the index</text>
  <text x="340" y="284" fill="#8b949e" font-size="11.5">sorted working list · deepest directory first · returns root hash</text>

  <!-- footer -->
  <rect x="30" y="330" width="700" height="66" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="356" fill="#e6edf3" font-size="12" font-weight="600">For each row, note what the method takes in and what it writes, using their real method names.</text>
  <text x="46" y="380" fill="#8b949e" font-size="12">Also find the line that sorts the working list. No sort means the tree hashes may change between runs.</text>
</svg>

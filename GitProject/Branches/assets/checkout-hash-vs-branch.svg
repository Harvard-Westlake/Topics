<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <title>Checking out a commit hash detaches HEAD from every branch, so a commit moves only HEAD. Checking out a branch keeps HEAD on that branch, so a commit moves the branch and HEAD follows.</title>
  <style>
    .commit { fill: #161b22; stroke: #a371f7; stroke-width: 2; }
    .label { fill: #e6edf3; font-weight: 700; font-size: 12px; text-anchor: middle; }
    .arrow { stroke: #8b949e; stroke-width: 2; }
    .cap { fill: #e6edf3; }
    .a { animation: capA 14s linear infinite; }
    .b { animation: capB 14s linear infinite; }
    .c, .c5, .noteR { animation: capC 14s linear infinite; }
    .noteL { animation: noteL 14s linear infinite; }
    .headL { animation: headL 14s linear infinite; }
    .headR { animation: headR 14s linear infinite; }
    .featR { animation: featR 14s linear infinite; }
    @keyframes capA { 0%, 19% { opacity: 1; } 21.43%, 100% { opacity: 0; } }
    @keyframes capB { 0%, 21.43% { opacity: 0; } 25%, 47% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes capC { 0%, 50% { opacity: 0; } 53.57%, 100% { opacity: 1; } }
    @keyframes noteL { 0%, 21.43% { opacity: 0; } 25%, 100% { opacity: 1; } }
    @keyframes headL { 0%, 21.43% { transform: translate(0, 0); } 25%, 50% { transform: translate(-156px, 74px); } 53.57%, 100% { transform: translate(-98px, 142px); } }
    @keyframes headR { 0%, 21.43% { transform: translate(0, 0); } 25%, 50% { transform: translate(-66px, -122px); } 53.57%, 100% { transform: translate(24px, -122px); } }
    @keyframes featR { 0%, 50% { transform: translate(0, 0); } 53.57%, 100% { transform: translate(90px, 0); } }
    @media (prefers-reduced-motion: reduce) {
      .a, .b, .c, .c5, .noteL, .noteR, .headL, .headR, .featR { animation: none; }
      .a, .b { opacity: 0; }
      .c, .c5, .noteL, .noteR { opacity: 1; }
      .headL { transform: translate(-98px, 142px); }
      .headR { transform: translate(24px, -122px); }
      .featR { transform: translate(90px, 0); }
    }
  </style>
  <rect width="1000" height="450" rx="10" fill="#0d1117"/>
  <defs>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <line x1="500" y1="20" x2="500" y2="430" stroke="#30363d" stroke-width="2"/>

  <!-- ================= LEFT: checkout a commit hash ================= -->
  <g>
    <text x="30" y="34" font-size="15" font-weight="700" fill="#e6edf3">checkout <tspan fill="#a371f7">2b98fb…</tspan> <tspan fill="#8b949e" font-weight="400">(a commit hash)</tspan></text>

    <line x1="138" y1="220" x2="92" y2="220" class="arrow" marker-end="url(#back)"/>
    <line x1="228" y1="220" x2="182" y2="220" class="arrow" marker-end="url(#back)"/>
    <line x1="236" y1="144" x2="176" y2="204" class="arrow" marker-end="url(#back)"/>
    <line x1="272" y1="220" x2="284" y2="220" class="arrow"/>

    <circle cx="70" cy="220" r="20" class="commit"/><text x="70" y="224" class="label">C1</text>
    <circle cx="160" cy="220" r="20" class="commit"/><text x="160" y="224" class="label">C2</text>
    <circle cx="250" cy="220" r="20" class="commit"/><text x="250" y="224" class="label">C3</text>
    <circle cx="250" cy="130" r="20" class="commit"/><text x="250" y="134" class="label">C4</text>

    <rect x="286" y="206" width="60" height="28" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
    <text x="316" y="225" fill="#388bfd" font-weight="700" text-anchor="middle">main</text>
    <rect x="210" y="80" width="80" height="28" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="250" y="99" fill="#3fb950" font-weight="700" text-anchor="middle">feature</text>

    <!-- the new commit made while detached -->
    <g class="c5">
      <line x1="160" y1="308" x2="160" y2="242" class="arrow" marker-end="url(#back)"/>
      <circle cx="160" cy="330" r="20" class="commit"/><text x="160" y="334" class="label">C5</text>
    </g>

    <!-- HEAD label: above main, then on C2, then on C5 -->
    <g class="headL">
      <rect x="288" y="176" width="56" height="24" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
      <text x="316" y="193" fill="#f0883e" font-weight="700" font-size="12" text-anchor="middle">HEAD</text>
    </g>

    <text x="30" y="368" class="cap a">git/HEAD = ref: refs/heads/main (main points at C3)</text>
    <text x="30" y="368" class="cap b">git/HEAD = 2b98fb… (C2's hash). Detached.</text>
    <text x="30" y="368" class="cap c">commit: HEAD moves to C5. main still points at C3.</text>

    <g class="noteL">
      <rect x="30" y="386" width="440" height="50" rx="8" fill="#1c1a0f" stroke="#e3b341" stroke-width="2"/>
      <text x="50" y="407" fill="#e3b341" font-size="12">Detached HEAD: you are on no branch at all.</text>
      <text x="50" y="426" fill="#e3b341" font-size="12">A commit here moves HEAD and nothing else.</text>
    </g>
  </g>

  <!-- ================= RIGHT: checkout a branch ================= -->
  <g transform="translate(500, 0)">
    <text x="30" y="34" font-size="15" font-weight="700" fill="#e6edf3">checkout <tspan fill="#3fb950">feature</tspan> <tspan fill="#8b949e" font-weight="400">(a branch)</tspan></text>

    <line x1="138" y1="220" x2="92" y2="220" class="arrow" marker-end="url(#back)"/>
    <line x1="228" y1="220" x2="182" y2="220" class="arrow" marker-end="url(#back)"/>
    <line x1="236" y1="144" x2="176" y2="204" class="arrow" marker-end="url(#back)"/>
    <line x1="272" y1="220" x2="284" y2="220" class="arrow"/>

    <circle cx="70" cy="220" r="20" class="commit"/><text x="70" y="224" class="label">C1</text>
    <circle cx="160" cy="220" r="20" class="commit"/><text x="160" y="224" class="label">C2</text>
    <circle cx="250" cy="220" r="20" class="commit"/><text x="250" y="224" class="label">C3</text>
    <circle cx="250" cy="130" r="20" class="commit"/><text x="250" y="134" class="label">C4</text>

    <rect x="286" y="206" width="60" height="28" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
    <text x="316" y="225" fill="#388bfd" font-weight="700" text-anchor="middle">main</text>

    <!-- the new commit made on feature -->
    <g class="c5">
      <line x1="318" y1="130" x2="272" y2="130" class="arrow" marker-end="url(#back)"/>
      <circle cx="340" cy="130" r="20" class="commit"/><text x="340" y="134" class="label">C5</text>
    </g>

    <!-- feature label moves forward with the commit -->
    <g class="featR">
      <rect x="210" y="80" width="80" height="28" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="250" y="99" fill="#3fb950" font-weight="700" text-anchor="middle">feature</text>
    </g>

    <!-- HEAD label: above main, then above feature, then follows feature -->
    <g class="headR">
      <rect x="288" y="176" width="56" height="24" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
      <text x="316" y="193" fill="#f0883e" font-weight="700" font-size="12" text-anchor="middle">HEAD</text>
    </g>

    <text x="30" y="368" class="cap a">git/HEAD = ref: refs/heads/main (main points at C3)</text>
    <text x="30" y="368" class="cap b">git/HEAD = ref: refs/heads/feature</text>
    <text x="30" y="368" class="cap c">commit: feature moves to C5, and HEAD follows it.</text>

    <g class="noteR">
      <rect x="30" y="386" width="440" height="50" rx="8" fill="#0f1f14" stroke="#3fb950" stroke-width="2"/>
      <text x="50" y="407" fill="#3fb950" font-size="12">On branch feature: the commit moved feature forward.</text>
      <text x="50" y="426" fill="#3fb950" font-size="12">HEAD still names feature, and main did not move.</text>
    </g>
  </g>
</svg>

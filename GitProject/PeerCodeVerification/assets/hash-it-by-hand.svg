<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGrn" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect width="760" height="420" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">One extra byte, a completely different hash</text>

  <!-- correct path -->
  <text x="30" y="76" fill="#3fb950" font-size="12" font-weight="600">EXACT BYTES</text>
  <rect x="30" y="86" width="220" height="70" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="44" y="112" fill="#e6edf3" font-size="12" font-family="Menlo, Consolas, monospace">printf 'sha1test' &gt; sha1test.txt</text>
  <text x="44" y="138" fill="#8b949e" font-size="12">8 bytes · no newline</text>
  <line x1="252" y1="121" x2="282" y2="121" stroke="#3fb950" stroke-width="3" marker-end="url(#arrowGrn)"/>
  <rect x="288" y="86" width="100" height="70" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="338" y="115" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">SHA-1</text>
  <text x="338" y="138" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace">shasum</text>
  <line x1="390" y1="121" x2="420" y2="121" stroke="#3fb950" stroke-width="3" marker-end="url(#arrowGrn)"/>
  <rect x="426" y="86" width="304" height="70" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="440" y="112" fill="#e6edf3" font-size="11.5" font-family="Menlo, Consolas, monospace">12c4c60ee087ae0f12dc6abc88495e459f6f2654</text>
  <text x="440" y="138" fill="#3fb950" font-size="12" font-weight="600">✓ matches the filename in git/objects/</text>

  <!-- wrong path -->
  <text x="30" y="216" fill="#f85149" font-size="12" font-weight="600">ONE INVISIBLE BYTE TOO MANY</text>
  <rect x="30" y="226" width="220" height="70" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="44" y="252" fill="#e6edf3" font-size="12" font-family="Menlo, Consolas, monospace">echo "sha1test" | shasum</text>
  <text x="44" y="278" fill="#8b949e" font-size="12">9 bytes · ends in \n (0x0a)</text>
  <line x1="252" y1="261" x2="282" y2="261" stroke="#f85149" stroke-width="3" marker-end="url(#arrowRed)"/>
  <rect x="288" y="226" width="100" height="70" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="338" y="255" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">SHA-1</text>
  <text x="338" y="278" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace">shasum</text>
  <line x1="390" y1="261" x2="420" y2="261" stroke="#f85149" stroke-width="3" marker-end="url(#arrowRed)"/>
  <rect x="426" y="226" width="304" height="70" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="440" y="252" fill="#e6edf3" font-size="11.5" font-family="Menlo, Consolas, monospace">c06872ab31a625a1e19278fb222283f8b1d04c52</text>
  <text x="440" y="278" fill="#f85149" font-size="12" font-weight="600">✗ every character changed</text>

  <!-- middle note -->
  <text x="380" y="190" fill="#8b949e" font-size="12" text-anchor="middle">Same word. The only difference is the newline that echo adds and printf (or echo -n) does not.</text>

  <!-- footer -->
  <rect x="30" y="330" width="700" height="66" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="356" fill="#e6edf3" font-size="12" font-weight="600">Verify a classmate's hash: build the test file with printf, check wc -c, hash it yourself, then compare to ls git/objects.</text>
  <text x="46" y="380" fill="#8b949e" font-size="12">A near-miss usually means their code read the file line by line and lost or added a newline before hashing.</text>
</svg>

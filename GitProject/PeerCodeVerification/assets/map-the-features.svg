<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect width="760" height="440" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">A feature map: which method is which milestone?</text>

  <!-- source file -->
  <rect x="30" y="70" width="290" height="250" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="94" fill="#8b949e" font-size="12" font-weight="600">Git.java — their code</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12.5">
    <text x="46" y="122" fill="#e6edf3">public class Git {</text>
    <text x="62" y="152" fill="#e3b341">main(String[] args)</text>
    <text x="222" y="152" fill="#f85149" font-size="11">← empty</text>
    <text x="62" y="182" fill="#79c0ff">initRepo()</text>
    <text x="62" y="212" fill="#79c0ff">sha1(File file)</text>
    <text x="62" y="242" fill="#79c0ff">writeBlob(File file)</text>
    <text x="62" y="272" fill="#79c0ff">addToIndex(hash, path)</text>
    <text x="46" y="302" fill="#e6edf3">}</text>
  </g>

  <!-- arrows -->
  <line x1="322" y1="178" x2="374" y2="140" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="322" y1="208" x2="374" y2="185" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="322" y1="238" x2="374" y2="230" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="322" y1="268" x2="374" y2="275" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- milestone table -->
  <rect x="380" y="70" width="350" height="250" rx="8" fill="#161b22" stroke="#30363d"/>
  <line x1="380" y1="112" x2="730" y2="112" stroke="#30363d"/>
  <line x1="380" y1="162" x2="730" y2="162" stroke="#30363d"/>
  <line x1="380" y1="207" x2="730" y2="207" stroke="#30363d"/>
  <line x1="380" y1="252" x2="730" y2="252" stroke="#30363d"/>
  <g font-size="11.5">
    <text x="392" y="96" fill="#8b949e" font-weight="600">Milestone</text>
    <text x="482" y="96" fill="#8b949e" font-weight="600">Method</text>
    <text x="600" y="96" fill="#8b949e" font-weight="600">Writes</text>

    <text x="392" y="140" fill="#a371f7" font-weight="600">GP-2.1 init</text>
    <text x="482" y="140" fill="#e6edf3" font-family="Menlo, Consolas, monospace" font-size="11">initRepo()</text>
    <text x="600" y="134" fill="#e6edf3">git/, objects/,</text>
    <text x="600" y="150" fill="#e6edf3">index, HEAD</text>

    <text x="392" y="185" fill="#a371f7" font-weight="600">GP-2.2 hash</text>
    <text x="482" y="185" fill="#e6edf3" font-family="Menlo, Consolas, monospace" font-size="11">sha1(File)</text>
    <text x="600" y="185" fill="#e6edf3">a 40-char String</text>

    <text x="392" y="230" fill="#a371f7" font-weight="600">GP-2.3 blob</text>
    <text x="482" y="230" fill="#e6edf3" font-family="Menlo, Consolas, monospace" font-size="11">writeBlob(File)</text>
    <text x="600" y="230" fill="#e6edf3">git/objects/&lt;hash&gt;</text>

    <text x="392" y="275" fill="#a371f7" font-weight="600">GP-2.4 index</text>
    <text x="482" y="269" fill="#e6edf3" font-family="Menlo, Consolas, monospace" font-size="11">addToIndex(</text>
    <text x="482" y="283" fill="#e6edf3" font-family="Menlo, Consolas, monospace" font-size="11">  hash, path)</text>
    <text x="600" y="275" fill="#e6edf3">one line in git/index</text>
  </g>

  <!-- driver note -->
  <rect x="30" y="340" width="700" height="60" rx="8" fill="#161b22" stroke="#e3b341"/>
  <text x="46" y="364" fill="#e3b341" font-size="12" font-weight="600">main is empty → nothing runs on its own</text>
  <text x="46" y="386" fill="#8b949e" font-size="12">Add Verify.java in your fork with a main that calls initRepo(), then stages a file. Never edit their methods.</text>
</svg>

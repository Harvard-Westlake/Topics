<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <title>The ladder of persistence: variables last until a reload, browser storage lasts in one browser, a database is shared with everyone</title>
  <rect width="760" height="340" rx="10" fill="#0d1117"/>
  <text x="30" y="38" fill="#e6edf3" font-weight="700" font-size="15">Where data lives, and how long it lasts</text>

  <!-- rung 3 -->
  <rect x="30" y="56" width="700" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="48" y="84" fill="#3fb950" font-weight="700">A database (Firestore)</text>
  <text x="48" y="106" fill="#8b949e" font-size="12">on a server in the cloud</text>
  <text x="420" y="84" fill="#e6edf3">survives refresh, any device,</text>
  <text x="420" y="106" fill="#e6edf3">shared with everyone</text>

  <!-- rung 2 -->
  <rect x="30" y="140" width="700" height="70" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <text x="48" y="168" fill="#388bfd" font-weight="700">Cookies and local storage</text>
  <text x="48" y="190" fill="#8b949e" font-size="12">inside this one browser</text>
  <text x="420" y="168" fill="#e6edf3">survives refresh,</text>
  <text x="420" y="190" fill="#e6edf3">only this visitor, this device</text>

  <!-- rung 1 -->
  <rect x="30" y="224" width="700" height="70" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="48" y="252" fill="#f0883e" font-weight="700">JavaScript variables</text>
  <text x="48" y="274" fill="#8b949e" font-size="12">in this page's memory</text>
  <text x="420" y="252" fill="#e6edf3">gone the moment</text>
  <text x="420" y="274" fill="#e6edf3">the page reloads</text>

  <text x="30" y="324" fill="#8b949e" font-size="12">Each rung up lasts longer and reaches more people.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 386" width="910" height="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>Animated diagram of making a key pair. The command ssh-keygen picks a huge random number. That number becomes the private key, in the file id_ed25519, which can sign and is kept secret. The public key, in the file id_ed25519.pub, is calculated from the private key, can only check a signature, and is safe to share. Nobody can work backward from the public key to the private key.</title>
<style>@keyframes g0{0%,4%{opacity:0.12}6%,96%{opacity:1}100%{opacity:0.12}} .g0{animation:g0 14s linear infinite} @keyframes g1{0%,20%{opacity:0.12}22%,96%{opacity:1}100%{opacity:0.12}} .g1{animation:g1 14s linear infinite} @keyframes g2{0%,38%{opacity:0.12}40%,96%{opacity:1}100%{opacity:0.12}} .g2{animation:g2 14s linear infinite} @keyframes g3{0%,58%{opacity:0.12}60%,96%{opacity:1}100%{opacity:0.12}} .g3{animation:g3 14s linear infinite} @keyframes g4{0%,76%{opacity:0.12}78%,96%{opacity:1}100%{opacity:0.12}} .g4{animation:g4 14s linear infinite} @keyframes gd0{0%{opacity:0;transform:translate(0,0)}4%{opacity:0;transform:translate(0,0)}4.5%{opacity:1}18%{opacity:1;transform:translate(46px,0px)}19%,100%{opacity:0;transform:translate(46px,0px)}} .gd0{opacity:0;animation:gd0 14s linear infinite} @keyframes gd1{0%{opacity:0;transform:translate(0,0)}20%{opacity:0;transform:translate(0,0)}20.5%{opacity:1}36%{opacity:1;transform:translate(52px,0px)}37%,100%{opacity:0;transform:translate(52px,0px)}} .gd1{opacity:0;animation:gd1 14s linear infinite} @keyframes gd2{0%{opacity:0;transform:translate(0,0)}40%{opacity:0;transform:translate(0,0)}40.5%{opacity:1}56%{opacity:1;transform:translate(0px,46px)}57%,100%{opacity:0;transform:translate(0px,46px)}} .gd2{opacity:0;animation:gd2 14s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="mffc2e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffc2e2"/></marker><marker id="mf85149" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker></defs>
<rect width="910" height="386" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">Making a key pair: one command, two matching files</text>
<text x="30" y="56" fill="#8b949e" font-size="12">The computer picks a huge random number. That number becomes the private key, and the public key is calculated from it.</text>
<g class="g0">
<rect x="30" y="104" width="250" height="64" rx="8" fill="#010409" stroke="#30363d" stroke-width="1"/>
<text x="44" y="124" fill="#8b949e" font-size="10">terminal</text>
<text x="44" y="150" fill="#e6edf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ ssh-keygen -t ed25519</text>
<line x1="284" y1="136" x2="326" y2="136" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
</g>
<g class="g1">
<rect x="330" y="104" width="230" height="64" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
<text x="445" y="126" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="700">a huge random number</text>
<text x="445" y="150" text-anchor="middle" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">83 1f a7 c2 09 5e d4 ...</text>
<line x1="564" y1="136" x2="616" y2="136" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
</g>
<g class="g2">
<rect x="620" y="92" width="260" height="88" rx="8" fill="#161b22" stroke="#db61a2" stroke-width="2"/>
<g transform="translate(642,118) scale(1.0)" fill="none" stroke="#db61a2" stroke-width="2.4" stroke-linecap="round"><circle cx="0" cy="0" r="7"/><path d="M7 0 H27 M21 0 V6 M26 0 V5"/></g>
<text x="682" y="123" fill="#db61a2" font-size="13" font-weight="700">Private key</text>
<text x="866" y="123" text-anchor="end" fill="#8b949e" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">id_ed25519</text>
<text x="636" y="148" fill="#e6edf3" font-size="11">the random number itself</text>
<text x="636" y="166" fill="#8b949e" font-size="10.5">can sign. Kept secret, on this computer.</text>
</g>
<g class="g3">
<line x1="690" y1="182" x2="690" y2="228" stroke="#ffc2e2" stroke-width="1.6" marker-end="url(#mffc2e2)"/>
<text x="700" y="210" fill="#ffc2e2" font-size="10.5">calculated from it</text>
<rect x="620" y="232" width="260" height="88" rx="8" fill="#161b22" stroke="#ffc2e2" stroke-width="2"/>
<g transform="translate(642,258) scale(1.0)" fill="none" stroke="#ffc2e2" stroke-width="2.4" stroke-linecap="round"><circle cx="0" cy="0" r="7"/><path d="M7 0 H27 M21 0 V6 M26 0 V5"/></g>
<text x="682" y="263" fill="#ffc2e2" font-size="13" font-weight="700">Public key</text>
<text x="866" y="263" text-anchor="end" fill="#8b949e" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">id_ed25519.pub</text>
<text x="636" y="288" fill="#e6edf3" font-size="11">the matching half</text>
<text x="636" y="306" fill="#8b949e" font-size="10.5">can only check a signature. Safe to share.</text>
</g>
<g class="g4">
<line x1="840" y1="228" x2="840" y2="184" stroke="#f85149" stroke-width="1.6" marker-end="url(#mf85149)" stroke-dasharray="5 4"/>
<text x="828" y="211" text-anchor="end" fill="#f85149" font-size="15" font-weight="700">✕</text>
<rect x="30" y="232" width="530" height="88" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="46" y="256" fill="#e6edf3" font-size="12.5" font-weight="700">One direction only</text>
<text x="46" y="278" fill="#e6edf3" font-size="11.5">Going from private to public is quick arithmetic.</text>
<text x="46" y="298" fill="#e6edf3" font-size="11.5">Going back from public to private would take every computer on Earth longer</text>
<text x="46" y="314" fill="#e6edf3" font-size="11.5">than the age of the universe. That is why the public key is safe to hand out.</text>
</g>
<circle class="gd0" cx="284" cy="136" r="5" fill="#e6edf3"/>
<circle class="gd1" cx="564" cy="136" r="5" fill="#e3b341"/>
<circle class="gd2" cx="690" cy="182" r="5" fill="#ffc2e2"/>
<rect x="30" y="338" width="850" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="46" y="358" fill="#e6edf3" font-size="11.5">Run it once. The two files are a pair for good: neither one works with any other key.</text>
</svg>

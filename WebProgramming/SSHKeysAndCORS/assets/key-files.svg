<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 290" width="910" height="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>A terminal on your own computer. Listing the .ssh folder shows four files: id_ed25519, the private key that never leaves this computer, id_ed25519.pub, the public key that is safe to hand to anyone, known_hosts, and config. Printing id_ed25519.pub shows one line of text: the kind of key, the key itself, and a label.</title>
<style> @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="290" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">The two halves of a key are two files</text>
<text x="30" y="56" fill="#8b949e" font-size="12">Both live in the .ssh folder in your home folder. Only one of them may ever be shown to anyone.</text>
<rect x="30" y="76" width="850" height="196" rx="8" fill="#010409" stroke="#30363d" stroke-width="1"/>
<text x="44" y="95" fill="#8b949e" font-size="10.5">terminal, on your own computer</text>
<line x1="30" y1="104" x2="880" y2="104" stroke="#30363d" stroke-width="1"/>
<text x="44" y="124" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">$ ls -1 ~/.ssh</text>
<text x="44" y="143" fill="#f85149" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">id_ed25519</text>
<text x="866" y="143" text-anchor="end" fill="#f85149" font-size="11">private key: never leaves this computer</text>
<text x="44" y="162" fill="#3fb950" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">id_ed25519.pub</text>
<text x="866" y="162" text-anchor="end" fill="#3fb950" font-size="11">public key: safe to hand to anyone</text>
<text x="44" y="181" fill="#8b949e" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">known_hosts</text>
<text x="866" y="181" text-anchor="end" fill="#8b949e" font-size="11">fingerprints of servers you said yes to</text>
<text x="44" y="200" fill="#8b949e" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">config</text>
<text x="866" y="200" text-anchor="end" fill="#8b949e" font-size="11">nicknames for the servers you log in to</text>
<text x="44" y="219" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"></text>
<text x="44" y="238" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">$ cat ~/.ssh/id_ed25519.pub</text>
<text x="44" y="257" fill="#3fb950" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK8...x7Qp you@laptop</text>
<text x="866" y="257" text-anchor="end" fill="#8b949e" font-size="11">one line: kind, key, label</text>
</svg>

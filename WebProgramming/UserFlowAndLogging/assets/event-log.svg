<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 414" width="910" height="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>Animated diagram. Five things a user does (opens the page, presses Start, gets round 1 right, misses round 2, closes the tab) each become one row in a log with a time, an event name, and details. Reading the rows gives the time on the site, 2 minutes 5 seconds, and shows the user left right after a miss</title>
<style>@keyframes e0{0%{opacity:0;transform:translateX(-60px)}5%{opacity:0;transform:translateX(-60px)}11%{opacity:1;transform:translateX(0)}96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .e0{animation:e0 15s ease-out infinite} @keyframes a0{0%{opacity:.3}5%{opacity:.3}8%{opacity:1}96%{opacity:1}100%{opacity:.3}} .a0{animation:a0 15s linear infinite} @keyframes e1{0%{opacity:0;transform:translateX(-60px)}21%{opacity:0;transform:translateX(-60px)}27%{opacity:1;transform:translateX(0)}96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .e1{animation:e1 15s ease-out infinite} @keyframes a1{0%{opacity:.3}21%{opacity:.3}24%{opacity:1}96%{opacity:1}100%{opacity:.3}} .a1{animation:a1 15s linear infinite} @keyframes e2{0%{opacity:0;transform:translateX(-60px)}37%{opacity:0;transform:translateX(-60px)}43%{opacity:1;transform:translateX(0)}96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .e2{animation:e2 15s ease-out infinite} @keyframes a2{0%{opacity:.3}37%{opacity:.3}40%{opacity:1}96%{opacity:1}100%{opacity:.3}} .a2{animation:a2 15s linear infinite} @keyframes e3{0%{opacity:0;transform:translateX(-60px)}53%{opacity:0;transform:translateX(-60px)}59%{opacity:1;transform:translateX(0)}96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .e3{animation:e3 15s ease-out infinite} @keyframes a3{0%{opacity:.3}53%{opacity:.3}56%{opacity:1}96%{opacity:1}100%{opacity:.3}} .a3{animation:a3 15s linear infinite} @keyframes e4{0%{opacity:0;transform:translateX(-60px)}69%{opacity:0;transform:translateX(-60px)}75%{opacity:1;transform:translateX(0)}96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .e4{animation:e4 15s ease-out infinite} @keyframes a4{0%{opacity:.3}69%{opacity:.3}72%{opacity:1}96%{opacity:1}100%{opacity:.3}} .a4{animation:a4 15s linear infinite}  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="414" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">Logging: every action becomes a row</text>
<text x="30" y="56" fill="#8b949e">The site writes down what happened and when. It does not write down who you are or what you typed.</text>
<text x="30" y="98" fill="#e6edf3" font-weight="700">What the user does</text><text x="420" y="98" fill="#e6edf3" font-weight="700">What the log holds (time, event, details)</text>
<text x="340" y="98" text-anchor="middle" fill="#8b949e" font-size="10.5">one event each</text>
<g class="a0"><rect x="30" y="112" width="230" height="34" rx="6" fill="#161b22" stroke="#388bfd"/><text x="44" y="133" fill="#e6edf3">opens the page</text></g><g class="a1"><rect x="30" y="156" width="230" height="34" rx="6" fill="#161b22" stroke="#3fb950"/><text x="44" y="177" fill="#e6edf3">presses Start</text></g><g class="a2"><rect x="30" y="200" width="230" height="34" rx="6" fill="#161b22" stroke="#e3b341"/><text x="44" y="221" fill="#e6edf3">gets round 1 right</text></g><g class="a3"><rect x="30" y="244" width="230" height="34" rx="6" fill="#161b22" stroke="#e3b341"/><text x="44" y="265" fill="#e6edf3">misses round 2</text></g><g class="a4"><rect x="30" y="288" width="230" height="34" rx="6" fill="#161b22" stroke="#a371f7"/><text x="44" y="309" fill="#e6edf3">closes the tab</text></g><g class="e0"><rect x="420" y="112" width="460" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="434" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e" font-size="11.5">0:00</text><text x="484" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#388bfd" font-size="11.5" font-weight="700">page_view</text><text x="578" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3" font-size="11.5">path: /</text></g><path class="a0" d="M 262 129 L 416 129" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ah)" fill="none"/><g class="e1"><rect x="420" y="156" width="460" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="434" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e" font-size="11.5">0:04</text><text x="484" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3fb950" font-size="11.5" font-weight="700">click</text><text x="578" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3" font-size="11.5">target: start-button</text></g><path class="a1" d="M 262 173 L 416 173" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ah)" fill="none"/><g class="e2"><rect x="420" y="200" width="460" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="434" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e" font-size="11.5">0:31</text><text x="484" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e3b341" font-size="11.5" font-weight="700">answer</text><text x="578" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3" font-size="11.5">correct: true, round: 1</text></g><path class="a2" d="M 262 217 L 416 217" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ah)" fill="none"/><g class="e3"><rect x="420" y="244" width="460" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="434" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e" font-size="11.5">1:12</text><text x="484" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e3b341" font-size="11.5" font-weight="700">answer</text><text x="578" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3" font-size="11.5">correct: false, round: 2</text></g><path class="a3" d="M 262 261 L 416 261" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ah)" fill="none"/><g class="e4"><rect x="420" y="288" width="460" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="434" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e" font-size="11.5">2:05</text><text x="484" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a371f7" font-size="11.5" font-weight="700">page_hide</text><text x="578" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3" font-size="11.5">the tab was closed</text></g><path class="a4" d="M 262 305 L 416 305" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ah)" fill="none"/>
<rect x="30" y="344" width="850" height="52" rx="8" fill="#161b22" stroke="#3fb950"/>
<text x="46" y="365" fill="#3fb950" font-weight="700">Read the rows and the session tells its story</text>
<text x="46" y="384" fill="#e6edf3" font-size="11.5">Time on the site: 2:05 minus 0:00 = 2 minutes 5 seconds.  Start pressed after 4 seconds.  Left right after a miss in round 2.</text>
</svg>

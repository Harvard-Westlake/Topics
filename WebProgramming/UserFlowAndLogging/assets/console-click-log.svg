<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 282" width="740" height="282" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>A browser console showing four logged click events, each an object with an event name, the kind of element clicked (a button, an image, then the page heading twice), and the number of seconds since the page opened. A note points at the two heading clicks: the title looks like a button</title>
<style> @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="740" height="282" rx="10" fill="#0d1117"/>
<text x="30" y="34" fill="#e6edf3" font-size="16" font-weight="700">Your own clicks, as a log</text>
<text x="30" y="52" fill="#8b949e">A few lines of JavaScript turn each click into a row in the DevTools console.</text>
<rect x="30" y="70" width="680" height="170" rx="8" fill="#161b22" stroke="#30363d"/>
<rect x="30" y="70" width="680" height="26" rx="8" fill="#30363d"/><text x="46" y="88" fill="#e6edf3" font-size="11.5">Console</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
<text x="46" y="122" fill="#8b949e">&gt;</text><text x="62" y="122" fill="#e6edf3">{ event: <tspan fill="#3fb950">"click"</tspan>, target: <tspan fill="#3fb950">"BUTTON"</tspan>, secondsIn: <tspan fill="#e3b341">3</tspan> }</text>
<text x="46" y="150" fill="#8b949e">&gt;</text><text x="62" y="150" fill="#e6edf3">{ event: <tspan fill="#3fb950">"click"</tspan>, target: <tspan fill="#3fb950">"IMG"</tspan>, secondsIn: <tspan fill="#e3b341">9</tspan> }</text>
<text x="46" y="178" fill="#8b949e">&gt;</text><text x="62" y="178" fill="#e6edf3">{ event: <tspan fill="#3fb950">"click"</tspan>, target: <tspan fill="#3fb950">"H1"</tspan>, secondsIn: <tspan fill="#e3b341">14</tspan> }</text>
<text x="46" y="206" fill="#8b949e">&gt;</text><text x="62" y="206" fill="#e6edf3">{ event: <tspan fill="#3fb950">"click"</tspan>, target: <tspan fill="#3fb950">"H1"</tspan>, secondsIn: <tspan fill="#e3b341">15</tspan> }</text>
</g>
<path d="M 470 196 L 560 196" stroke="#f0883e" marker-end="url(#ah)" fill="none"/>
<text x="568" y="186" fill="#f0883e" font-size="11">clicked the title twice:</text><text x="568" y="202" fill="#f0883e" font-size="11">it looks like a button</text>
<text x="30" y="264" fill="#8b949e" font-size="11.5">Each row answers three things: what happened, on what, and when.</text>
</svg>

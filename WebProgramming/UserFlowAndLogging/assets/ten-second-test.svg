<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 326" width="740" height="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>A sketch of a page called Guess the song with three emoji, one text box, a Go button, and a streak counter, beside a ten-second timer bar. Three callouts point at the page: what is this is answered by the title, what do I do first is answered by one box and one button, and why would I stay is answered by a streak that starts at zero</title>
<style>@keyframes bar{0%{width:0}90%{width:300px}100%{width:300px}} .bar{animation:bar 10s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="740" height="326" rx="10" fill="#0d1117"/>
<text x="30" y="34" fill="#e6edf3" font-size="16" font-weight="700">The ten-second test</text>
<text x="30" y="52" fill="#8b949e">A new visitor gives your page about this long. Three questions must be answered by what is on screen.</text>
<rect x="30" y="72" width="330" height="214" rx="8" fill="#161b22" stroke="#30363d"/>
<rect x="30" y="72" width="330" height="24" rx="8" fill="#30363d"/><circle cx="46" cy="84" r="4" fill="#f85149"/><circle cx="60" cy="84" r="4" fill="#e3b341"/><circle cx="74" cy="84" r="4" fill="#3fb950"/>
<text x="195" y="130" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Guess the song</text>
<text x="195" y="176" text-anchor="middle" font-size="34">&#127769;&#128640;&#128104;</text>
<rect x="80" y="200" width="160" height="30" rx="6" fill="#0d1117" stroke="#388bfd"/><text x="92" y="220" fill="#8b949e">type your guess</text>
<rect x="250" y="200" width="60" height="30" rx="6" fill="#3fb950"/><text x="280" y="220" text-anchor="middle" fill="#0d1117" font-weight="700">Go</text>
<text x="195" y="262" text-anchor="middle" fill="#e3b341">streak: 0</text>
<rect x="30" y="300" width="300" height="8" rx="4" fill="#30363d"/><rect class="bar" x="30" y="300" width="300" height="8" rx="4" fill="#f0883e"/>
<text x="340" y="308" fill="#8b949e" font-size="10.5">10 s</text>
<rect x="400" y="76" width="310" height="58" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/><text x="555.0" y="101.0" text-anchor="middle" fill="#388bfd" font-size="13" font-weight="700">1. What is this?</text><text x="555.0" y="117.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">the title says it in three words</text>
<rect x="400" y="150" width="310" height="58" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="555.0" y="175.0" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">2. What do I do first?</text><text x="555.0" y="191.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">one box and one button, nothing else</text>
<rect x="400" y="224" width="310" height="58" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/><text x="555.0" y="249.0" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="700">3. Why would I stay?</text><text x="555.0" y="265.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">a streak that starts at zero</text>
<path d="M 400 105 L 290 124" stroke="#8b949e" marker-end="url(#ah)" fill="none"/><path d="M 400 179 L 316 208" stroke="#8b949e" marker-end="url(#ah)" fill="none"/><path d="M 400 253 L 240 258" stroke="#8b949e" marker-end="url(#ah)" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 462" width="910" height="462" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>Flowchart of one visitor using a guess-the-song app: arrive, first ten seconds, type a guess, a choice on whether it was correct, feedback, a choice to play again that loops back, and the outcome of sharing a streak</title>
<style>@keyframes go{0%{offset-distance:0%;opacity:0}3%{opacity:1}95%{opacity:1}100%{offset-distance:100%;opacity:0}} .dot{offset-path:path('M 110 150 L 290 150 L 470 150 L 650 150 L 650 285 L 470 285 L 470 150 L 650 150 L 650 285 L 830 285');animation:go 12s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="462" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">A user flow: what one visitor does, step by step</text>
<text x="30" y="56" fill="#8b949e">Example app: guess the song from three emoji. Boxes are what the user sees, diamonds are choices, and every option leads somewhere.</text>
<rect x="30" y="115" width="160" height="70" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/><text x="110.0" y="138.0" text-anchor="middle" fill="#388bfd" font-size="13" font-weight="700">Arrive</text><text x="110.0" y="154.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">sees three emoji</text><text x="110.0" y="170.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">and a text box</text>
<path class="" d="M 190 150 L 228 150" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="230" y="115" width="150" height="70" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/><text x="305.0" y="138.0" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="700">First ten seconds</text><text x="305.0" y="154.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">knows: guess the song</text><text x="305.0" y="170.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">no instructions read</text>
<path class="" d="M 380 150 L 408 150" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="410" y="115" width="130" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="475.0" y="146.0" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">Type a guess</text><text x="475.0" y="162.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">the core action</text>
<path class="" d="M 540 150 L 588 150" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<polygon points="650,108.0 712.0,150 650,192.0 588.0,150" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/><text x="650" y="154" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">Correct?</text>
<path class="" d="M 650 192 L 650 248" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="684.0" y="224.0" text-anchor="middle" fill="#8b949e" font-size="10.5">yes or no</text>
<rect x="570" y="250" width="160" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="650.0" y="273.0" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">Feedback</text><text x="650.0" y="289.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">answer revealed,</text><text x="650.0" y="305.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">streak goes up or resets</text>
<path class="" d="M 570 285 L 542 285" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<polygon points="470,243.0 540.0,285 470,327.0 400.0,285" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/><text x="470" y="289" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">Play again?</text>
<path class="" d="M 470 243 L 470 188" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="514.0" y="219.5" text-anchor="middle" fill="#8b949e" font-size="10.5">yes: the loop</text>
<path d="M 470 327 L 470 372 L 800 372 L 800 322" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text x="635" y="366" text-anchor="middle" fill="#8b949e" font-size="10.5">no</text>
<rect x="740" y="250" width="140" height="70" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="810.0" y="273.0" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="700">Outcome</text><text x="810.0" y="289.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">shares the streak,</text><text x="810.0" y="305.0" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="400">leaves smiling</text>
<circle class="dot" r="6" fill="#e6edf3"/>
<rect x="30" y="398" width="850" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="417" fill="#e6edf3" font-size="11.5">Read it out loud as the user: "I arrive, I see three emoji, I type a guess, I find out if I was right, I go again or I share."</text>
<text x="46" y="434" fill="#8b949e" font-size="11">If a box has no arrow out, the user is stuck there. If a sentence needs the word "somehow", the plan is not finished.</text>
</svg>

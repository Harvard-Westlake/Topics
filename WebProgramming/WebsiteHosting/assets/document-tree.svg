<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><title>One HTML file seen three ways: as text in VS Code, as the tree of tags the browser builds, and as the page the browser draws. Hovering a node in the Elements panel highlights the same tag in the text and the same box on the page.</title><style>.a{opacity:0} @keyframes k1{0%{opacity:0} 0.0%{opacity:1} 31.0%{opacity:1} 32.5%{opacity:0} 100%{opacity:0}} .k1{animation:k1 12s linear infinite} @keyframes k2{0%{opacity:0} 32.5%{opacity:0} 34.0%{opacity:1} 64.0%{opacity:1} 65.5%{opacity:0} 100%{opacity:0}} .k2{animation:k2 12s linear infinite} @keyframes k3{0%{opacity:0} 65.5%{opacity:0} 67.0%{opacity:1} 97.0%{opacity:1} 98.5%{opacity:0} 100%{opacity:0}} .k3{animation:k3 12s linear infinite} @keyframes k4{0.0%{transform:translate(492px,172px)} 31.0%{transform:translate(492px,172px)} 34.0%{transform:translate(556px,172px)} 64.0%{transform:translate(556px,172px)} 67.0%{transform:translate(417px,172px)} 97.0%{transform:translate(417px,172px)} 100.0%{transform:translate(492px,172px)}} .k4{animation:k4 12s ease-in-out infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important} .fin{opacity:1!important}}</style><defs><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs><rect x="0" y="0" width="900" height="400" rx="10" fill="#0d1117" /><text x="24" y="40" fill="#e6edf3" font-size="15" font-weight="700">index.html in VS Code</text><text x="24" y="58" fill="#8b949e" font-size="11">the text you typed</text><rect x="24" y="70" width="276" height="250" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2" /><rect x="30" y="144" width="264" height="19" rx="4" fill="#79c0ff" stroke="#79c0ff" stroke-width="1" class="a k3" fill-opacity="0.25" /><rect x="30" y="204" width="264" height="19" rx="4" fill="#79c0ff" stroke="#79c0ff" stroke-width="1" class="a k1 fin" fill-opacity="0.25" /><rect x="30" y="224" width="264" height="19" rx="4" fill="#79c0ff" stroke="#79c0ff" stroke-width="1" class="a k2" fill-opacity="0.25" /><rect x="30" y="244" width="264" height="19" rx="4" fill="#79c0ff" stroke="#79c0ff" stroke-width="1" class="a k2" fill-opacity="0.25" /><text x="36" y="98" fill="#8b949e" font-size="12">&lt;!DOCTYPE html&gt;</text><text x="36" y="118" fill="#e6edf3" font-size="12">&lt;html&gt;</text><text x="36" y="138" fill="#e6edf3" font-size="12">  &lt;head&gt;</text><text x="36" y="158" fill="#e6edf3" font-size="12">    &lt;title&gt;My First Page&lt;/title&gt;</text><text x="36" y="178" fill="#e6edf3" font-size="12">  &lt;/head&gt;</text><text x="36" y="198" fill="#e6edf3" font-size="12">  &lt;body&gt;</text><text x="36" y="218" fill="#e6edf3" font-size="12">    &lt;h1&gt;Hello from VS Code&lt;/h1&gt;</text><text x="36" y="238" fill="#e6edf3" font-size="12">    &lt;p&gt;This page was</text><text x="36" y="258" fill="#e6edf3" font-size="12">       written by hand.&lt;/p&gt;</text><text x="36" y="278" fill="#e6edf3" font-size="12">  &lt;/body&gt;</text><text x="36" y="298" fill="#e6edf3" font-size="12">&lt;/html&gt;</text><line x1="304" y1="195" x2="326" y2="195" stroke="#f0883e" stroke-width="2.5" marker-end="url(#orange)"/><line x1="584" y1="195" x2="606" y2="195" stroke="#f0883e" stroke-width="2.5" marker-end="url(#orange)"/><text x="330" y="40" fill="#e6edf3" font-size="15" font-weight="700">The tree the browser builds</text><text x="330" y="58" fill="#8b949e" font-size="11">the Elements panel in DevTools</text><rect x="330" y="70" width="250" height="250" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2" /><line x1="455" y1="108" x2="395" y2="134" stroke="#6e7681" stroke-width="1.5"/><line x1="455" y1="108" x2="515" y2="134" stroke="#6e7681" stroke-width="1.5"/><line x1="395" y1="154" x2="395" y2="180" stroke="#6e7681" stroke-width="1.5"/><line x1="515" y1="154" x2="480" y2="180" stroke="#6e7681" stroke-width="1.5"/><line x1="515" y1="154" x2="545" y2="180" stroke="#6e7681" stroke-width="1.5"/><rect x="429.0" y="88" width="52" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" /><text x="455" y="102" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">html</text><rect x="369.0" y="134" width="52" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" /><text x="395" y="148" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">head</text><rect x="489.0" y="134" width="52" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" /><text x="515" y="148" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">body</text><rect x="365.0" y="176" width="60" height="28" rx="7" fill="#79c0ff" stroke="#79c0ff" stroke-width="1.5" class="a k3" fill-opacity="0.3" /><rect x="369.0" y="180" width="52" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" /><text x="395" y="194" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">title</text><rect x="458.0" y="176" width="44" height="28" rx="7" fill="#79c0ff" stroke="#79c0ff" stroke-width="1.5" class="a k1 fin" fill-opacity="0.3" /><rect x="462.0" y="180" width="36" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" /><text x="480" y="194" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">h1</text><rect x="526.0" y="176" width="38" height="28" rx="7" fill="#79c0ff" stroke="#79c0ff" stroke-width="1.5" class="a k2" fill-opacity="0.3" /><rect x="530.0" y="180" width="30" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" /><text x="545" y="194" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">p</text><text x="455" y="232" fill="#8b949e" font-size="10" text-anchor="middle" font-style="italic">Hello from VS Code</text><line x1="480" y1="200" x2="462" y2="222" stroke="#6e7681" stroke-width="1" stroke-dasharray="2 3"/><text x="455" y="290" fill="#8b949e" font-size="10" text-anchor="middle">one node per tag, one parent per node</text><text x="455" y="304" fill="#8b949e" font-size="10" text-anchor="middle">head: facts.  body: what you see</text><g class="k4"><path d="M0,0 L0,15 L4,11 L7,17 L9.5,16 L6.5,10 L11.5,10 Z" fill="#ffffff" stroke="#0d1117" stroke-width="1"/></g><text x="610" y="40" fill="#e6edf3" font-size="15" font-weight="700">The page</text><text x="610" y="58" fill="#8b949e" font-size="11">what the browser draws from the tree</text><rect x="610" y="70" width="266" height="250" rx="8" fill="#ffffff" stroke="#30363d" stroke-width="1.5" /><path d="M610,78 a8,8 0 0 1 8,-8 h250 a8,8 0 0 1 8,8 v18 h-266 z" fill="#21262d"/><rect x="618" y="74" width="112" height="18" rx="4" fill="#30363d" /><rect x="615" y="71" width="118" height="24" rx="6" fill="#79c0ff" stroke="#79c0ff" stroke-width="1.5" class="a k3" fill-opacity="0.3" /><text x="674" y="87" fill="#e6edf3" font-size="11" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">My First Page</text><rect x="616" y="102" width="254" height="16" rx="4" fill="#f0f3f6" stroke="#d0d7de" stroke-width="1" /><text x="622" y="114" fill="#57606a" font-size="9" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">file:///Users/you/site/index.html</text><rect x="622" y="138" width="192" height="26" rx="4" fill="#79c0ff" stroke="#79c0ff" stroke-width="1.5" class="a k1 fin" fill-opacity="0.3" /><text x="628" y="157" fill="#1f2328" font-size="17" font-weight="700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Hello from VS Code</text><rect x="622" y="171" width="200" height="20" rx="4" fill="#79c0ff" stroke="#79c0ff" stroke-width="1.5" class="a k2" fill-opacity="0.3" /><text x="628" y="185" fill="#1f2328" font-size="11" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">This page was written by hand.</text><text x="628" y="300" fill="#57606a" font-size="9" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">address starts with file:// so only this computer can open it</text><text x="24" y="352" fill="#e6edf3" font-size="13" class="a k1 fin">Hover h1 in the Elements panel: the same tag in the file, the same box on the page.</text><text x="24" y="352" fill="#e6edf3" font-size="13" class="a k2">Hover p: every node in the tree is a box on the page.</text><text x="24" y="352" fill="#e6edf3" font-size="13" class="a k3">Hover title: head holds facts about the page, so it shows in the tab, not on the page.</text><text x="24" y="378" fill="#8b949e" font-size="12">View Page Source shows the file the browser received. Elements shows the tree it built from it.</text></svg>

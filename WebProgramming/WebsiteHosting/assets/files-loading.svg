<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><title>How a small website loads: the browser requests index.html, builds the document tree one tag at a time, and when it reaches the link and script tags it requests style.css and scripts/main.js from the folder tree. The Network panel shows three requests, the page is painted when the CSS arrives, and the count changes when the JavaScript runs.</title><style>.a{opacity:0} @keyframes k1{0%{opacity:0} 1.5%{opacity:0} 3.0%{opacity:1} 9.0%{opacity:1} 10.5%{opacity:0} 100%{opacity:0}} .k1{animation:k1 14s linear infinite} @keyframes k2{0%{opacity:0} 17.5%{opacity:0} 19.0%{opacity:1} 25.0%{opacity:1} 26.5%{opacity:0} 100%{opacity:0}} .k2{animation:k2 14s linear infinite} @keyframes k3{0%{opacity:0} 21.5%{opacity:0} 23.0%{opacity:1} 29.0%{opacity:1} 30.5%{opacity:0} 100%{opacity:0}} .k3{animation:k3 14s linear infinite} @keyframes k4{0%{opacity:0} 6.5%{opacity:0} 8.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k4{animation:k4 14s linear infinite} @keyframes k5{0%{opacity:0} 9.5%{opacity:0} 11.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k5{animation:k5 14s linear infinite} @keyframes k6{0%{opacity:0} 12.5%{opacity:0} 14.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k6{animation:k6 14s linear infinite} @keyframes k7{0%{opacity:0} 15.5%{opacity:0} 17.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k7{animation:k7 14s linear infinite} @keyframes k8{0%{opacity:0} 18.5%{opacity:0} 20.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k8{animation:k8 14s linear infinite} @keyframes k9{0%{opacity:0} 21.5%{opacity:0} 23.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k9{animation:k9 14s linear infinite} @keyframes k10{0%{opacity:0} 24.5%{opacity:0} 26.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k10{animation:k10 14s linear infinite} @keyframes k11{0%{opacity:0} 27.5%{opacity:0} 29.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k11{animation:k11 14s linear infinite} @keyframes k12{0%{opacity:0} 30.5%{opacity:0} 32.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k12{animation:k12 14s linear infinite} @keyframes k13{0%{opacity:0} 0.5%{opacity:0} 2.0%{opacity:1} 8.0%{opacity:1} 9.5%{opacity:0} 100%{opacity:0}} .k13{animation:k13 14s linear infinite} @keyframes k14{0%{opacity:0} 3.5%{opacity:0} 5.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k14{animation:k14 14s linear infinite} @keyframes k15{0%{opacity:0} 22.5%{opacity:0} 24.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k15{animation:k15 14s linear infinite} @keyframes k16{0%{opacity:0} 32.5%{opacity:0} 34.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k16{animation:k16 14s linear infinite} @keyframes k17{0%{opacity:0} 16.5%{opacity:0} 18.0%{opacity:1} 24.0%{opacity:1} 25.5%{opacity:0} 100%{opacity:0}} .k17{animation:k17 14s linear infinite} @keyframes k18{0%{opacity:0} 20.5%{opacity:0} 22.0%{opacity:1} 28.0%{opacity:1} 29.5%{opacity:0} 100%{opacity:0}} .k18{animation:k18 14s linear infinite} @keyframes k19{0%{opacity:0} 22.5%{opacity:0} 24.0%{opacity:1} 30.0%{opacity:1} 31.5%{opacity:0} 100%{opacity:0}} .k19{animation:k19 14s linear infinite} @keyframes k20{0%{opacity:0} 28.5%{opacity:0} 30.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k20{animation:k20 14s linear infinite} @keyframes k21{0%{opacity:0} 28.5%{opacity:0} 30.0%{opacity:1} 40.0%{opacity:1} 41.5%{opacity:0} 100%{opacity:0}} .k21{animation:k21 14s linear infinite} @keyframes k22{0%{opacity:0} 38.5%{opacity:0} 40.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k22{animation:k22 14s linear infinite} @keyframes k23{0%{opacity:0} 38.5%{opacity:0} 40.0%{opacity:1} 47.0%{opacity:1} 48.5%{opacity:0} 100%{opacity:0}} .k23{animation:k23 14s linear infinite} @keyframes k24{0%{opacity:0} 28.5%{opacity:0} 30.0%{opacity:1} 40.0%{opacity:1} 41.5%{opacity:0} 100%{opacity:0}} .k24{animation:k24 14s linear infinite} @keyframes k25{0%{opacity:0} 38.5%{opacity:0} 40.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k25{animation:k25 14s linear infinite} @keyframes k26{0%{opacity:0} 0.0%{opacity:1} 24.0%{opacity:1} 25.5%{opacity:0} 100%{opacity:0}} .k26{animation:k26 14s linear infinite} @keyframes k27{0%{opacity:0} 22.5%{opacity:0} 24.0%{opacity:1} 40.0%{opacity:1} 41.5%{opacity:0} 100%{opacity:0}} .k27{animation:k27 14s linear infinite} @keyframes k28{0%{opacity:0} 38.5%{opacity:0} 40.0%{opacity:1} 90.0%{opacity:1} 91.5%{opacity:0} 100%{opacity:0}} .k28{animation:k28 14s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important} .fin{opacity:1!important}}</style><defs><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs><rect x="0" y="0" width="940" height="420" rx="10" fill="#0d1117" /><text x="24" y="40" fill="#e6edf3" font-size="15" font-weight="700">The folder tree</text><text x="24" y="58" fill="#8b949e" font-size="11">public/ on your laptop</text><rect x="24" y="70" width="220" height="230" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2" /><text x="36" y="98" fill="#79c0ff" font-size="12" font-weight="700">public/</text><rect x="30" y="109" width="208" height="21" rx="4" fill="#3fb950" stroke="#3fb950" stroke-width="1.5" class="a k1" fill-opacity="0.25" /><text x="36" y="124" fill="#e6edf3" font-size="12">  index.html</text><rect x="30" y="135" width="208" height="21" rx="4" fill="#3fb950" stroke="#3fb950" stroke-width="1.5" class="a k2" fill-opacity="0.25" /><text x="36" y="150" fill="#e6edf3" font-size="12">  style.css</text><text x="36" y="176" fill="#79c0ff" font-size="12" font-weight="700">  scripts/</text><rect x="30" y="187" width="208" height="21" rx="4" fill="#3fb950" stroke="#3fb950" stroke-width="1.5" class="a k3" fill-opacity="0.25" /><text x="36" y="202" fill="#e6edf3" font-size="12">    main.js</text><text x="36" y="228" fill="#e6edf3" font-size="12">    game.js</text><text x="36" y="254" fill="#e6edf3" font-size="12">  game.html</text><text x="134" y="288" fill="#8b949e" font-size="10" text-anchor="middle">the browser reads these files</text><text x="274" y="40" fill="#e6edf3" font-size="15" font-weight="700">The document tree</text><text x="274" y="58" fill="#8b949e" font-size="11">built as the browser reads index.html, top to bottom</text><rect x="274" y="70" width="340" height="230" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2" /><line x1="444" y1="108" x2="360" y2="134" stroke="#6e7681" stroke-width="1.5" class="a k5 fin"/><line x1="360" y1="154" x2="312" y2="180" stroke="#6e7681" stroke-width="1.5" class="a k6 fin"/><line x1="360" y1="154" x2="366" y2="180" stroke="#6e7681" stroke-width="1.5" class="a k7 fin"/><line x1="360" y1="154" x2="424" y2="180" stroke="#6e7681" stroke-width="1.5" class="a k8 fin"/><line x1="444" y1="108" x2="530" y2="134" stroke="#6e7681" stroke-width="1.5" class="a k9 fin"/><line x1="530" y1="154" x2="482" y2="180" stroke="#6e7681" stroke-width="1.5" class="a k10 fin"/><line x1="530" y1="154" x2="528" y2="180" stroke="#6e7681" stroke-width="1.5" class="a k11 fin"/><line x1="528" y1="200" x2="578" y2="180" stroke="#6e7681" stroke-width="1.5" class="a k12 fin"/><rect x="418.0" y="88" width="52" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" class="a k4 fin" /><text x="444" y="102" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" class="a k4 fin">html</text><rect x="334.0" y="134" width="52" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" class="a k5 fin" /><text x="360" y="148" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" class="a k5 fin">head</text><rect x="288.0" y="180" width="48" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" class="a k6 fin" /><text x="312" y="194" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" class="a k6 fin">title</text><rect x="344.0" y="180" width="44" height="20" rx="5" fill="#0d1117" stroke="#f0883e" stroke-width="1.5" class="a k7 fin" /><text x="366" y="194" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" class="a k7 fin">link</text><rect x="396.0" y="180" width="56" height="20" rx="5" fill="#0d1117" stroke="#f0883e" stroke-width="1.5" class="a k8 fin" /><text x="424" y="194" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" class="a k8 fin">script</text><rect x="504.0" y="134" width="52" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" class="a k9 fin" /><text x="530" y="148" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" class="a k9 fin">body</text><rect x="464.0" y="180" width="36" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" class="a k10 fin" /><text x="482" y="194" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" class="a k10 fin">h1</text><rect x="513.0" y="180" width="30" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" class="a k11 fin" /><text x="528" y="194" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" class="a k11 fin">p</text><rect x="556.0" y="180" width="44" height="20" rx="5" fill="#0d1117" stroke="#a371f7" stroke-width="1.5" class="a k12 fin" /><text x="578" y="194" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" class="a k12 fin">span</text><text x="366" y="214" fill="#f0883e" font-size="9" text-anchor="middle" class="a k7 fin">href="style.css"</text><text x="424" y="228" fill="#f0883e" font-size="9" text-anchor="middle" class="a k8 fin">src="scripts/main.js"</text><text x="578" y="214" fill="#8b949e" font-size="10" text-anchor="middle" class="a k12 fin">0 → 1</text><text x="444" y="290" fill="#8b949e" font-size="10" text-anchor="middle">one node per tag. link and script hold file addresses</text><text x="644" y="40" fill="#e6edf3" font-size="15" font-weight="700">What the browser does</text><text x="644" y="58" fill="#8b949e" font-size="11">the Network panel, then the page</text><rect x="644" y="70" width="272" height="96" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" /><text x="654" y="88" fill="#8b949e" font-size="11" font-weight="700">Network</text><rect x="730" y="76" width="112" height="17" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5" class="a k13" /><text x="786" y="88" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle" class="a k13">GET /index.html</text><text x="654" y="110" fill="#e6edf3" font-size="12" class="a k14 fin">index.html</text><text x="906" y="110" fill="#8b949e" font-size="11" text-anchor="end" class="a k14 fin">document</text><text x="654" y="132" fill="#e6edf3" font-size="12" class="a k15 fin">style.css</text><text x="906" y="132" fill="#8b949e" font-size="11" text-anchor="end" class="a k15 fin">stylesheet</text><text x="654" y="154" fill="#e6edf3" font-size="12" class="a k16 fin">main.js</text><text x="906" y="154" fill="#8b949e" font-size="11" text-anchor="end" class="a k16 fin">script</text><path d="M390,190 C 520,190 560,128 640,128" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="5 4" class="a k17" marker-end="url(#orange)"/><text x="596" y="112" fill="#f0883e" font-size="10" font-weight="700" text-anchor="end" class="a k17">asks for it</text><path d="M454,190 C 540,190 580,150 640,150" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="5 4" class="a k18" marker-end="url(#orange)"/><rect x="644" y="186" width="272" height="114" rx="6" fill="#ffffff" stroke="#30363d" stroke-width="1.5" /><text x="656" y="218" fill="#000000" font-size="16" font-weight="700" font-family="Georgia, Times, serif" class="a k19">Welcome to Section 1</text><text x="656" y="244" fill="#000000" font-size="12" font-family="Georgia, Times, serif" class="a k19">Count: 0</text><path d="M645,192 a6,6 0 0 1 6,-6 h258 a6,6 0 0 1 6,6 v30 h-270 z" fill="#388bfd" class="a k20 fin"/><text x="656" y="212" fill="#ffffff" font-size="14" font-weight="700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" class="a k20 fin">Welcome to Section 1</text><text x="656" y="252" fill="#1f2328" font-size="12" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" class="a k20 fin">Count:</text><circle cx="716" cy="248" r="12" fill="#3fb950" fill-opacity=".35" class="a k23"/><text x="716" y="252" fill="#1f2328" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" class="a k21">0</text><text x="716" y="252" fill="#1f2328" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" class="a k22 fin">1</text><text x="656" y="284" fill="#e3b341" font-size="10" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" class="a k24">CSS arrived: the tree is painted</text><text x="656" y="284" fill="#3fb950" font-size="10" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" class="a k25 fin">JavaScript arrived: it changed a node</text><text x="24" y="352" fill="#e6edf3" font-size="13" class="a k26">1. The browser asks for index.html and reads it top to bottom, adding one node per tag.</text><text x="24" y="352" fill="#e6edf3" font-size="13" class="a k27">2. link and script are addresses. The browser sends one more request for every file the tree names.</text><text x="24" y="352" fill="#e6edf3" font-size="13" class="a k28 fin">3. HTML is the tree, CSS paints it, JavaScript changes it. Three files, three requests.</text><text x="24" y="378" fill="#8b949e" font-size="12">The HTML is the only required file. Remove style.css and the page still loads, just unpainted.</text></svg>

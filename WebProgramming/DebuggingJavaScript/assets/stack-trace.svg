<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <title>Reading an error in the DevTools console: the message says what broke, the top line says where, and the lines below say how the program got there</title>
  <rect width="760" height="330" rx="10" fill="#0d1117"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <text x="30" y="38" fill="#e6edf3" font-weight="700" font-size="15">DevTools, Console tab</text>
  <rect x="30" y="52" width="450" height="146" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <rect x="31" y="53" width="448" height="28" rx="7" fill="#21262d"/>
  <text x="44" y="72" fill="#8b949e" font-size="12">Elements</text>
  <text x="124" y="72" fill="#e6edf3" font-size="12" font-weight="700">Console</text>
  <text x="196" y="72" fill="#8b949e" font-size="12">Sources</text>
  <text x="268" y="72" fill="#8b949e" font-size="12">Application</text>
  <text x="44" y="106" fill="#ff7b72" font-size="12">Uncaught TypeError: Cannot read properties</text>
  <text x="44" y="124" fill="#ff7b72" font-size="12">  of null (reading 'addEventListener')</text>
  <text x="56" y="152" fill="#f0883e" font-size="12">at setupButtons (game.js:12:10)</text>
  <text x="56" y="172" fill="#8b949e" font-size="12">at startGame (game.js:3:3)</text>
  <text x="56" y="190" fill="#8b949e" font-size="12">at main.js:8:1</text>

  <line x1="488" y1="114" x2="540" y2="100" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="548" y="96" fill="#ff7b72" font-weight="700">WHAT broke</text>
  <text x="548" y="114" fill="#8b949e" font-size="12">the error type and message</text>
  <line x1="488" y1="150" x2="540" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="548" y="146" fill="#f0883e" font-weight="700">WHERE it broke</text>
  <text x="548" y="164" fill="#8b949e" font-size="12">file game.js, line 12</text>
  <line x1="488" y1="182" x2="540" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="548" y="200" fill="#79c0ff" font-weight="700">HOW it got there</text>
  <text x="548" y="218" fill="#8b949e" font-size="12">earlier calls, newest first</text>

  <text x="30" y="262" fill="#8b949e" font-size="12">Click the file and line (game.js:12:10) and DevTools jumps to that exact spot in your code.</text>
  <text x="30" y="286" fill="#8b949e" font-size="12">Here, line 12 asked a missing element (null) to listen for clicks: usually a typo in an id,</text>
  <text x="30" y="306" fill="#8b949e" font-size="12">or a script that ran before the element existed.</text>
</svg>

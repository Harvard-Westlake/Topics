<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 464" width="910" height="464" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>Animated diagram of one playtest. On the left, five things a tester did, with times. On the right, each becomes one line on the playtest form: first ten seconds, most interactive element, best moment, where I got stuck, and the moment I left.</title>
<style>@keyframes a0{0%,5%{opacity:0.3}7%,96%{opacity:1}100%{opacity:0.3}} .a0{animation:a0 16s linear infinite} @keyframes f0{0%,8%{opacity:0;transform:translateX(-50px)}14%,96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .f0{animation:f0 16s ease-out infinite} @keyframes a1{0%,22%{opacity:0.3}24%,96%{opacity:1}100%{opacity:0.3}} .a1{animation:a1 16s linear infinite} @keyframes f1{0%,25%{opacity:0;transform:translateX(-50px)}31%,96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .f1{animation:f1 16s ease-out infinite} @keyframes a2{0%,39%{opacity:0.3}41%,96%{opacity:1}100%{opacity:0.3}} .a2{animation:a2 16s linear infinite} @keyframes f2{0%,42%{opacity:0;transform:translateX(-50px)}48%,96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .f2{animation:f2 16s ease-out infinite} @keyframes a3{0%,56%{opacity:0.3}58%,96%{opacity:1}100%{opacity:0.3}} .a3{animation:a3 16s linear infinite} @keyframes f3{0%,59%{opacity:0;transform:translateX(-50px)}65%,96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .f3{animation:f3 16s ease-out infinite} @keyframes a4{0%,73%{opacity:0.3}75%,96%{opacity:1}100%{opacity:0.3}} .a4{animation:a4 16s linear infinite} @keyframes f4{0%,76%{opacity:0;transform:translateX(-50px)}82%,96%{opacity:1;transform:translateX(0)}100%{opacity:0}} .f4{animation:f4 16s ease-out infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="464" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">Playtesting: write down what happened, not what you thought</text>
<text x="30" y="56" fill="#8b949e" font-size="12">On the left, what one tester did in two minutes. On the right, what each moment becomes on the form.</text>
<text x="30" y="92" fill="#e6edf3" font-size="12" font-weight="700">What the tester did</text>
<text x="400" y="92" fill="#e6edf3" font-size="12" font-weight="700">What goes on the form</text>
<g class="a0">
<rect x="30" y="104" width="310" height="46" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="44" y="132" fill="#388bfd" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0:04</text>
<text x="86" y="132" fill="#e6edf3" font-size="11.5">clicks the title twice, nothing happens</text>
<line x1="344" y1="127" x2="394" y2="127" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
</g>
<g class="f0">
<rect x="400" y="104" width="480" height="46" rx="8" fill="#1c2330" stroke="#388bfd" stroke-width="1.5"/>
<text x="414" y="123" fill="#388bfd" font-size="11.5" font-weight="700">First ten seconds</text>
<text x="414" y="140" fill="#e6edf3" font-size="11.5">thought the title was the Start button</text>
</g>
<g class="a1">
<rect x="30" y="162" width="310" height="46" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="44" y="190" fill="#3fb950" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0:11</text>
<text x="86" y="190" fill="#e6edf3" font-size="11.5">finds Start and taps an emoji tile</text>
<line x1="344" y1="185" x2="394" y2="185" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
</g>
<g class="f1">
<rect x="400" y="162" width="480" height="46" rx="8" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="414" y="181" fill="#3fb950" font-size="11.5" font-weight="700">Most interactive element</text>
<text x="414" y="198" fill="#e6edf3" font-size="11.5">the emoji tiles bounce when tapped</text>
</g>
<g class="a2">
<rect x="30" y="220" width="310" height="46" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
<text x="44" y="248" fill="#e3b341" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0:58</text>
<text x="86" y="248" fill="#e6edf3" font-size="11.5">plays a fourth round in a row</text>
<line x1="344" y1="243" x2="394" y2="243" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
</g>
<g class="f2">
<rect x="400" y="220" width="480" height="46" rx="8" fill="#1c2330" stroke="#e3b341" stroke-width="1.5"/>
<text x="414" y="239" fill="#e3b341" font-size="11.5" font-weight="700">Best moment</text>
<text x="414" y="256" fill="#e6edf3" font-size="11.5">the streak hit 3 and the whole page flashed gold</text>
</g>
<g class="a3">
<rect x="30" y="278" width="310" height="46" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
<text x="44" y="306" fill="#f0883e" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1:40</text>
<text x="86" y="306" fill="#e6edf3" font-size="11.5">scrolls up, down, and up again</text>
<line x1="344" y1="301" x2="394" y2="301" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
</g>
<g class="f3">
<rect x="400" y="278" width="480" height="46" rx="8" fill="#1c2330" stroke="#f0883e" stroke-width="1.5"/>
<text x="414" y="297" fill="#f0883e" font-size="11.5" font-weight="700">Where I got stuck</text>
<text x="414" y="314" fill="#e6edf3" font-size="11.5">looked for a way to share my score and found none</text>
</g>
<g class="a4">
<rect x="30" y="336" width="310" height="46" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<text x="44" y="364" fill="#f85149" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2:15</text>
<text x="86" y="364" fill="#e6edf3" font-size="11.5">closes the tab</text>
<line x1="344" y1="359" x2="394" y2="359" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
</g>
<g class="f4">
<rect x="400" y="336" width="480" height="46" rx="8" fill="#1c2330" stroke="#f85149" stroke-width="1.5"/>
<text x="414" y="355" fill="#f85149" font-size="11.5" font-weight="700">The moment I left</text>
<text x="414" y="372" fill="#e6edf3" font-size="11.5">a second wrong answer, and still no hint</text>
</g>
<rect x="30" y="400" width="850" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="46" y="419" fill="#e6edf3" font-size="11.5">Every line names something that happened on the screen. None of them says good or bad.</text>
<text x="46" y="436" fill="#8b949e" font-size="11">The builder can act on all five without asking the tester a single question.</text>
</svg>

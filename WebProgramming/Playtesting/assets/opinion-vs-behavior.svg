<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 326" width="910" height="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>Three opinions, each rewritten as a behavior. It was fun becomes: I played six rounds and only stopped because class ended. The buttons were confusing becomes: I tapped the gray box three times before I saw it was not a button. Good design becomes: the score grew bigger each time I got one right, so I kept watching it.</title>
<style> @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="326" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">An opinion tells the builder how you felt. A behavior tells them what to fix.</text>
<text x="30" y="56" fill="#8b949e" font-size="12">Same three testers, same three apps. Only the right-hand column can be acted on.</text>
<text x="30" y="92" fill="#f85149" font-size="12" font-weight="700">Opinion</text>
<text x="330" y="92" fill="#3fb950" font-size="12" font-weight="700">Behavior: what I did and what the screen did</text>
<rect x="30" y="104" width="250" height="44" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<text x="44" y="131" fill="#e6edf3" font-size="12">It was fun.</text>
<line x1="284" y1="126" x2="324" y2="126" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
<rect x="330" y="104" width="550" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="344" y="131" fill="#e6edf3" font-size="12">I played six rounds and only stopped because class ended.</text>
<rect x="30" y="160" width="250" height="44" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<text x="44" y="187" fill="#e6edf3" font-size="12">The buttons were confusing.</text>
<line x1="284" y1="182" x2="324" y2="182" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
<rect x="330" y="160" width="550" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="344" y="187" fill="#e6edf3" font-size="12">I tapped the gray box three times before I saw it was not a button.</text>
<rect x="30" y="216" width="250" height="44" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<text x="44" y="243" fill="#e6edf3" font-size="12">Good design.</text>
<line x1="284" y1="238" x2="324" y2="238" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
<rect x="330" y="216" width="550" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="344" y="243" fill="#e6edf3" font-size="12">The score grew bigger each time I got one right, so I kept watching it.</text>
<rect x="30" y="278" width="850" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="46" y="298" fill="#e6edf3" font-size="11.5">Nobody can fix "confusing". Anybody can fix a gray box that looks like a button.</text>
</svg>

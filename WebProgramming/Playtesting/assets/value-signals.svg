<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="430" rx="12" fill="#0d1117"/>
<text x="450" y="34" fill="#e6edf3" font-size="18" font-weight="700" text-anchor="middle">Four signals of what an app is worth to a stranger</text>
<rect x="24" y="54" width="198" height="130" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
<text x="123" y="80" fill="#388bfd" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">ACTIVATION</text>
<text x="123" y="108" fill="#e6edf3" font-size="15" text-anchor="middle">How fast did it</text>
<text x="123" y="128" fill="#e6edf3" font-size="15" text-anchor="middle">give me something?</text>
<text x="123" y="164" fill="#8b949e" font-size="13" text-anchor="middle">seconds to first reward</text>
<path d="M225 119 l14 0 m-6 -6 l6 6 l-6 6" stroke="#8b949e" stroke-width="2" fill="none"/>
<rect x="242" y="54" width="198" height="130" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="341" y="80" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">ACTIVITY</text>
<text x="341" y="108" fill="#e6edf3" font-size="15" text-anchor="middle">Am I doing,</text>
<text x="341" y="128" fill="#e6edf3" font-size="15" text-anchor="middle">or only watching?</text>
<text x="341" y="164" fill="#8b949e" font-size="13" text-anchor="middle">actions per minute</text>
<path d="M443 119 l14 0 m-6 -6 l6 6 l-6 6" stroke="#8b949e" stroke-width="2" fill="none"/>
<rect x="460" y="54" width="198" height="130" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
<text x="559" y="80" fill="#e3b341" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">ATTENTION</text>
<text x="559" y="108" fill="#e6edf3" font-size="15" text-anchor="middle">When did I</text>
<text x="559" y="128" fill="#e6edf3" font-size="15" text-anchor="middle">first look away?</text>
<text x="559" y="164" fill="#8b949e" font-size="13" text-anchor="middle">minutes per visit</text>
<path d="M661 119 l14 0 m-6 -6 l6 6 l-6 6" stroke="#8b949e" stroke-width="2" fill="none"/>
<rect x="678" y="54" width="198" height="130" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
<text x="777" y="80" fill="#a371f7" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">RETENTION</text>
<text x="777" y="108" fill="#e6edf3" font-size="15" text-anchor="middle">Would I open</text>
<text x="777" y="128" fill="#e6edf3" font-size="15" text-anchor="middle">it again tomorrow?</text>
<text x="777" y="164" fill="#8b949e" font-size="13" text-anchor="middle">share who come back</text>
<text x="24" y="222" fill="#e6edf3" font-size="15" font-weight="700">Retention is the result. The other three are the causes.</text>
<path d="M70 250 V390 H610" stroke="#8b949e" stroke-width="1.5" fill="none"/>
<text x="62" y="262" fill="#8b949e" font-size="12" text-anchor="end">100%</text>
<text x="24" y="330" fill="#8b949e" font-size="12" transform="rotate(-90 24 330)" text-anchor="middle">still using it</text>
<text x="70" y="410" fill="#8b949e" font-size="12" text-anchor="middle">day 1</text>
<text x="250" y="410" fill="#8b949e" font-size="12" text-anchor="middle">day 7</text>
<text x="590" y="410" fill="#8b949e" font-size="12" text-anchor="middle">day 30</text>
<path d="M70 256 C110 330 200 384 600 389" stroke="#f85149" stroke-width="3" fill="none"/>
<path d="M70 256 C110 300 180 318 600 322" stroke="#a371f7" stroke-width="3" fill="none"/>
<text x="630" y="318" fill="#a371f7" font-size="14" font-weight="700">Flattens: some people stay.</text>
<text x="630" y="338" fill="#8b949e" font-size="13">The app is worth something.</text>
<text x="630" y="380" fill="#f85149" font-size="14" font-weight="700">Falls to zero: novelty.</text>
<text x="630" y="400" fill="#8b949e" font-size="13">Fun once, then forgotten.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="470" rx="12" fill="#0d1117"/>
<rect x="24" y="18" width="852" height="46" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
<text x="450" y="48" fill="#e6edf3" font-size="19" font-weight="700" text-anchor="middle">Was it worth the time you chose to spend?</text>
<rect x="24" y="84" width="198" height="130" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
<text x="123" y="110" fill="#388bfd" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">OUTCOME</text>
<text x="123" y="138" fill="#e6edf3" font-size="14.5" text-anchor="middle">Am I better off than</text>
<text x="123" y="158" fill="#e6edf3" font-size="14.5" text-anchor="middle">with what I'd use instead?</text>
<text x="123" y="194" fill="#8b949e" font-size="13" text-anchor="middle">same task, both ways</text>
<rect x="242" y="84" width="198" height="130" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="341" y="110" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">SUCCESS</text>
<text x="341" y="138" fill="#e6edf3" font-size="14.5" text-anchor="middle">Did I finish</text>
<text x="341" y="158" fill="#e6edf3" font-size="14.5" text-anchor="middle">with no help?</text>
<text x="341" y="194" fill="#8b949e" font-size="13" text-anchor="middle">finished, gave up, or wrong</text>
<rect x="460" y="84" width="198" height="130" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
<text x="559" y="110" fill="#e3b341" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">FIRST VALUE</text>
<text x="559" y="138" fill="#e6edf3" font-size="14.5" text-anchor="middle">How fast did I get</text>
<text x="559" y="158" fill="#e6edf3" font-size="14.5" text-anchor="middle">something I care about?</text>
<text x="559" y="194" fill="#8b949e" font-size="13" text-anchor="middle">seconds to first real result</text>
<rect x="678" y="84" width="198" height="130" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
<text x="777" y="110" fill="#a371f7" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">RETURN</text>
<text x="777" y="138" fill="#e6edf3" font-size="14.5" text-anchor="middle">When the need comes</text>
<text x="777" y="158" fill="#e6edf3" font-size="14.5" text-anchor="middle">back, do I come back?</text>
<text x="777" y="194" fill="#8b949e" font-size="13" text-anchor="middle">value again, not visits</text>
<text x="24" y="252" fill="#e6edf3" font-size="15" font-weight="700">The curve shows who came back. It cannot say why.</text>
<path d="M70 290 V430 H610" stroke="#8b949e" stroke-width="1.5" fill="none"/>
<text x="62" y="302" fill="#8b949e" font-size="12" text-anchor="end">100%</text>
<text x="24" y="370" fill="#8b949e" font-size="12" transform="rotate(-90 24 370)" text-anchor="middle">still using it</text>
<text x="70" y="450" fill="#8b949e" font-size="12" text-anchor="middle">day 1</text>
<text x="250" y="450" fill="#8b949e" font-size="12" text-anchor="middle">day 7</text>
<text x="590" y="450" fill="#8b949e" font-size="12" text-anchor="middle">day 30</text>
<path d="M70 296 C110 370 200 424 600 429" stroke="#f85149" stroke-width="3" fill="none"/>
<path d="M70 296 C110 340 180 358 600 362" stroke="#a371f7" stroke-width="3" fill="none"/>
<text x="630" y="340" fill="#a371f7" font-size="14" font-weight="700">Flattens: some people stay.</text>
<text x="630" y="385" fill="#f85149" font-size="14" font-weight="700">Falls to zero: fun once,</text>
<text x="630" y="404" fill="#f85149" font-size="14" font-weight="700">then forgotten.</text>
<text x="630" y="252" fill="#8b949e" font-size="13">Busy is not better: a broken</text>
<text x="630" y="270" fill="#8b949e" font-size="13">app also gets more clicks.</text>
</svg>
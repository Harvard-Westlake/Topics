<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#388bfd"/></marker>
  </defs>
  <rect width="760" height="320" rx="10" fill="#0d1117"/>
  <text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">Codex only knows the folder you start it in</text>

  <!-- the repository folder -->
  <rect x="30" y="60" width="250" height="170" rx="8" fill="#161b22" stroke="#f0883e"/>
  <text x="46" y="84" fill="#f0883e" font-size="12" font-weight="700" font-family="Menlo, Consolas, monospace">~/HTCS_Projects/YOUR-PROJECT</text>
  <g fill="#e6edf3" font-size="12" font-family="Menlo, Consolas, monospace">
    <text x="46" y="108">README.md</text>
    <text x="46" y="126">src/Blob.java</text>
    <text x="46" y="144">src/Tree.java</text>
    <text x="46" y="162">src/Commit.java</text>
    <text x="46" y="180">.git/</text>
  </g>
  <text x="46" y="212" fill="#8b949e" font-size="12">you typed: cd here, then codex</text>

  <line x1="282" y1="145" x2="342" y2="145" stroke="#388bfd" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="312" y="132" fill="#388bfd" font-size="11" font-weight="600" text-anchor="middle">reads</text>

  <!-- codex -->
  <rect x="348" y="96" width="134" height="98" rx="8" fill="#161b22" stroke="#a371f7"/>
  <text x="364" y="120" fill="#a371f7" font-size="13" font-weight="700">CODEX</text>
  <g fill="#8b949e" font-size="11" font-family="Menlo, Consolas, monospace">
    <text x="364" y="142">Explored</text>
    <text x="364" y="158">  List ls -la</text>
    <text x="364" y="174">  Read Blob.java</text>
  </g>

  <line x1="484" y1="145" x2="534" y2="145" stroke="#388bfd" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="509" y="132" fill="#388bfd" font-size="11" font-weight="600" text-anchor="middle">answers</text>

  <!-- the exchange -->
  <rect x="540" y="60" width="190" height="170" rx="8" fill="#161b22" stroke="#79c0ff"/>
  <text x="554" y="84" fill="#79c0ff" font-size="11" font-weight="700">YOU</text>
  <text x="554" y="100" fill="#e6edf3" font-size="11">Which file hashes a blob?</text>
  <text x="554" y="130" fill="#a371f7" font-size="11" font-weight="700">CODEX</text>
  <text x="554" y="146" fill="#e6edf3" font-size="11">Blob.java, sha1 over</text>
  <text x="554" y="162" fill="#e6edf3" font-size="11" font-family="Menlo, Consolas, monospace">"blob &lt;size&gt;\0" + bytes</text>
  <text x="554" y="192" fill="#e3b341" font-size="11" font-weight="700">YOU</text>
  <text x="554" y="208" fill="#e3b341" font-size="11">open Blob.java and check it</text>

  <text x="30" y="266" fill="#f85149" font-size="12" font-weight="600">Start it on your Desktop and it will confidently describe your Desktop.</text>
  <text x="30" y="288" fill="#8b949e" font-size="12">No receipts (Explored / List / Read lines) means an answer written from the file names alone.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>One rich experience, drawn as a dense web of connections, is squeezed through three openings of different widths: a vocabulary of about 50 words produces Big. Pretty. More!, about 5,000 words produces a plain sentence about an orange and pink sky, and 50,000 or more produces a precise, layered description</title>

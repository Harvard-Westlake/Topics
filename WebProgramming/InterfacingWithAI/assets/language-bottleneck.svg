<text x="135" y="84" fill="#8b949e" text-anchor="middle">a sunset over the ocean</text>
<text x="135" y="360" fill="#8b949e" text-anchor="middle" font-size="11">brain: millions of synapses firing</text>
<text x="135" y="376" fill="#8b949e" text-anchor="middle" font-size="11">AI: thousands of numbers per token</text>
<path d="M 270 96 L 360 125 L 400 125 L 400 135 L 360 135 L 270 164 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><circle class="d0" cx="262" cy="130" r="5" fill="#3fb950"/><text x="420" y="108" fill="#3fb950" font-size="13" font-weight="700">about 50 words (or tokens)<tspan fill="#8b949e" font-weight="400" font-size="11">   a toddler, or a tiny model</tspan></text><g class="b0 fin" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3"><text x="420" y="132">"Big. Pretty. More!"</text><text x="420" y="150"></text></g><path d="M 270 192 L 360 213 L 400 213 L 400 239 L 360 239 L 270 260 Z" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/><circle class="d1" cx="262" cy="226" r="5" fill="#388bfd"/><text x="420" y="204" fill="#388bfd" font-size="13" font-weight="700">about 5,000<tspan fill="#8b949e" font-weight="400" font-size="11">   a ten-year-old, or a small model</tspan></text><g class="b1 fin" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3"><text x="420" y="228">"The sky went orange and pink. I felt calm,</text><text x="420" y="246">and kind of sad when it was over."</text></g><path d="M 270 288 L 360 299 L 400 299 L 400 345 L 360 345 L 270 356 Z" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><circle class="d2" cx="262" cy="322" r="5" fill="#a371f7"/><text x="420" y="300" fill="#a371f7" font-size="13" font-weight="700">about 50,000 or more<tspan fill="#8b949e" font-weight="400" font-size="11">   a well-read adult, or a large model</tspan></text><g class="b2 fin" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3"><text x="420" y="324">"Amber light draining into violet, and the ache of</text><text x="420" y="342">watching something beautiful that does not need you."</text></g>
<text x="30" y="410" fill="#8b949e">The experience never changed. Only the words available to carry it out did.</text>
</svg>

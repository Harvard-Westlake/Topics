<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="300" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">One monthly allowance, two ways to spend it</text>

  <!-- week axis -->
  <g fill="#8b949e" font-size="12" text-anchor="middle">
    <text x="240" y="72">Week 1</text>
    <text x="380" y="72">Week 2</text>
    <text x="520" y="72">Week 3</text>
    <text x="660" y="72">Week 4</text>
  </g>
  <g stroke="#30363d" stroke-dasharray="3 4">
    <line x1="310" y1="80" x2="310" y2="222"/>
    <line x1="450" y1="80" x2="450" y2="222"/>
    <line x1="590" y1="80" x2="590" y2="222"/>
  </g>

  <!-- big model -->
  <text x="30" y="118" fill="#e6edf3" font-size="13" font-weight="700">Biggest model,</text>
  <text x="30" y="136" fill="#e6edf3" font-size="13" font-weight="700">high effort</text>
  <rect x="170" y="100" width="560" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
  <rect x="170" y="100" width="98" height="36" rx="6" fill="#f85149"/>
  <text x="282" y="123" fill="#f85149" font-size="12" font-weight="600">allowance gone · locked out until it resets</text>

  <!-- small model -->
  <text x="30" y="198" fill="#e6edf3" font-size="13" font-weight="700">GPT-5.6-Luna,</text>
  <text x="30" y="216" fill="#e6edf3" font-size="13" font-weight="700">low effort</text>
  <rect x="170" y="180" width="560" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
  <rect x="170" y="180" width="560" height="36" rx="6" fill="#238636"/>
  <text x="186" y="203" fill="#e6edf3" font-size="12" font-weight="600">still answering in week 4: the whole unit</text>

  <text x="30" y="258" fill="#8b949e" font-size="12">Model choice, reasoning effort, long chats, tool use, and Fast mode (2.5×) all spend it faster.</text>
  <text x="30" y="280" fill="#8b949e" font-size="12">/usage shows what is left. Check it at the start and end of class to see what one period cost.</text>
</svg>

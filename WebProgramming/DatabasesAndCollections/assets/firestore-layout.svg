<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <title>Your site in each visitor's browser keeps local storage and cookies, and reads and writes a shared Firestore database through security rules</title>
  <rect width="760" height="360" rx="10" fill="#0d1117"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>

  <text x="30" y="38" fill="#e6edf3" font-weight="700" font-size="15">Each visitor's browser</text>
  <rect x="30" y="52" width="230" height="74" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <text x="46" y="78" fill="#79c0ff" font-weight="700">your site</text>
  <text x="46" y="100" fill="#8b949e" font-size="12">local storage: theme=dark</text>
  <text x="46" y="118" fill="#8b949e" font-size="12">cookie: returning=true</text>
  <rect x="30" y="140" width="230" height="74" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <text x="46" y="166" fill="#79c0ff" font-weight="700">your site</text>
  <text x="46" y="188" fill="#8b949e" font-size="12">local storage: theme=light</text>
  <text x="46" y="206" fill="#8b949e" font-size="12">(first visit, no cookie)</text>

  <line x1="266" y1="89" x2="352" y2="140" stroke="#3fb950" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
  <line x1="266" y1="177" x2="352" y2="160" stroke="#3fb950" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>

  <rect x="358" y="100" width="22" height="100" rx="4" fill="#f0883e"/>
  <text x="369" y="226" fill="#f0883e" font-weight="700" text-anchor="middle">rules</text>
  <text x="369" y="244" fill="#8b949e" font-size="11" text-anchor="middle">check</text>
  <text x="369" y="258" fill="#8b949e" font-size="11" text-anchor="middle">every</text>
  <text x="369" y="272" fill="#8b949e" font-size="11" text-anchor="middle">request</text>

  <text x="400" y="38" fill="#e6edf3" font-weight="700" font-size="15">Firestore (shared by everyone)</text>
  <rect x="400" y="52" width="330" height="200" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="416" y="80" fill="#3fb950" font-weight="700">guestbook/</text>
  <text x="510" y="80" fill="#8b949e" font-size="11">a collection</text>
  <text x="432" y="104" fill="#e6edf3">visitor-001</text>
  <text x="540" y="104" fill="#8b949e" font-size="11">a document</text>
  <text x="448" y="124" fill="#8b949e" font-size="12">name: "Alice"</text>
  <text x="448" y="142" fill="#8b949e" font-size="12">message: "Cool site!"</text>
  <text x="432" y="166" fill="#e6edf3">visitor-002</text>
  <text x="416" y="200" fill="#3fb950" font-weight="700">scores/</text>
  <text x="432" y="224" fill="#e6edf3">high-score</text>
  <text x="540" y="224" fill="#8b949e" font-size="12">points: 9800</text>

  <text x="30" y="296" fill="#8b949e" font-size="12">Browser storage belongs to one visitor on one device.</text>
  <text x="30" y="318" fill="#8b949e" font-size="12">Firestore belongs to the whole site: every visitor reads and writes the same documents,</text>
  <text x="30" y="340" fill="#8b949e" font-size="12">but only what the rules allow.</text>
</svg>

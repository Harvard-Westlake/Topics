<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<title>Three key and value pairs leave a setDoc call on your page one at a time and land as fields inside the document named games in the Firestore collection named tastes</title>
<style>.fin{} @keyframes f0{0%{transform:translate(-500px,-26px);opacity:0} 3%{transform:translate(-500px,-26px);opacity:1} 12%{transform:translate(-500px,-26px);opacity:1} 26%{transform:translate(0,0);opacity:1} 93%{transform:translate(0,0);opacity:1} 98%{transform:translate(0,0);opacity:0} 100%{transform:translate(-500px,-26px);opacity:0}} .f0{animation:f0 12s ease-in-out infinite} @keyframes s0{0%{opacity:0} 25%{opacity:0} 27%{opacity:1} 93%{opacity:1} 98%{opacity:0} 100%{opacity:0}} .s0{animation:s0 12s linear infinite} @keyframes f1{0%{transform:translate(-500px,-40px);opacity:0} 3%{transform:translate(-500px,-40px);opacity:1} 34%{transform:translate(-500px,-40px);opacity:1} 48%{transform:translate(0,0);opacity:1} 93%{transform:translate(0,0);opacity:1} 98%{transform:translate(0,0);opacity:0} 100%{transform:translate(-500px,-40px);opacity:0}} .f1{animation:f1 12s ease-in-out infinite} @keyframes s1{0%{opacity:0} 47%{opacity:0} 49%{opacity:1} 93%{opacity:1} 98%{opacity:0} 100%{opacity:0}} .s1{animation:s1 12s linear infinite} @keyframes f2{0%{transform:translate(-500px,-54px);opacity:0} 3%{transform:translate(-500px,-54px);opacity:1} 56%{transform:translate(-500px,-54px);opacity:1} 70%{transform:translate(0,0);opacity:1} 93%{transform:translate(0,0);opacity:1} 98%{transform:translate(0,0);opacity:0} 100%{transform:translate(-500px,-54px);opacity:0}} .f2{animation:f2 12s ease-in-out infinite} @keyframes s2{0%{opacity:0} 69%{opacity:0} 71%{opacity:1} 93%{opacity:1} 98%{opacity:0} 100%{opacity:0}} .s2{animation:s2 12s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important} .fin{opacity:1!important}}</style>
<rect width="900" height="400" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Storing data: each key and value becomes one field in a document</text>
<rect x="30" y="60" width="400" height="290" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="84" fill="#8b949e" font-size="12" font-weight="700">YOUR PAGE</text>
<text x="46" y="118" fill="#e6edf3">setDoc(doc(database,</text>
<text x="70" y="140"><tspan fill="#388bfd">"tastes"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#f0883e">"games"</tspan><tspan fill="#e6edf3">), {</tspan></text>
<rect x="98" y="150" width="244" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>
<rect x="98" y="180" width="244" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>
<rect x="98" y="210" width="244" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>
<text x="46" y="268" fill="#e6edf3">});</text>
<text x="46" y="306" fill="#8b949e" font-size="12">key: the label you look the value up by</text>
<text x="46" y="326" fill="#8b949e" font-size="12">value: text, a number, true or false, a list</text>
<text x="470" y="206" fill="#8b949e" font-size="22">&#8594;</text>
<rect x="520" y="60" width="350" height="290" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="536" y="84" fill="#8b949e" font-size="12" font-weight="700">FIRESTORE</text>
<rect x="540" y="96" width="320" height="240" rx="8" fill="none" stroke="#388bfd" stroke-width="1.5"/>
<text x="554" y="118" fill="#388bfd" font-weight="700">tastes<tspan fill="#8b949e" font-weight="400">  collection (a folder)</tspan></text>
<rect x="556" y="130" width="296" height="198" rx="8" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="570" y="154" fill="#f0883e" font-weight="700">games<tspan fill="#8b949e" font-weight="400">  document (a named file)</tspan></text>
<rect x="598" y="176" width="244" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/><text x="852" y="196" fill="#3fb950" font-size="12" class="s0 fin" opacity="0">saved</text><g class="f0"><rect x="598" y="176" width="244" height="32" rx="6" fill="#1f2937" stroke="#388bfd"/><text x="610" y="196"><tspan fill="#388bfd">favorite</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#3fb950">"Wordle"</tspan></text></g><rect x="598" y="220" width="244" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/><text x="852" y="240" fill="#3fb950" font-size="12" class="s1 fin" opacity="0">saved</text><g class="f1"><rect x="598" y="220" width="244" height="32" rx="6" fill="#1f2937" stroke="#388bfd"/><text x="610" y="240"><tspan fill="#388bfd">why</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#3fb950">"one puzzle a day"</tspan></text></g><rect x="598" y="264" width="244" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/><text x="852" y="284" fill="#3fb950" font-size="12" class="s2 fin" opacity="0">saved</text><g class="f2"><rect x="598" y="264" width="244" height="32" rx="6" fill="#1f2937" stroke="#388bfd"/><text x="610" y="284"><tspan fill="#388bfd">rating</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#f0883e">9</tspan></text></g>
<text x="30" y="380" fill="#8b949e" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A document is a JSON object with a name. The collection is the folder it is filed in.</text>
</svg>

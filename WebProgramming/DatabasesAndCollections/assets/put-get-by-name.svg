<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<title>A put and a get each name a collection and a document: setDoc finds the collection tastes, then the document games, and writes it; getDoc finds the same collection and document by name and brings its fields back; every other collection and document is left alone</title>
<style>.a{opacity:0} @keyframes pl{0%{opacity:0} 1%{opacity:0} 2%{opacity:1} 46%{opacity:1} 47.5%{opacity:0} 100%{opacity:0}} .pl{animation:pl 14s linear infinite} @keyframes pc{0%{opacity:0} 7%{opacity:0} 8%{opacity:1} 46%{opacity:1} 47.5%{opacity:0} 100%{opacity:0}} .pc{animation:pc 14s linear infinite} @keyframes pd{0%{opacity:0} 15%{opacity:0} 16%{opacity:1} 46%{opacity:1} 47.5%{opacity:0} 100%{opacity:0}} .pd{animation:pd 14s linear infinite} @keyframes pk{0%{opacity:0} 33%{opacity:0} 34%{opacity:1} 46%{opacity:1} 47.5%{opacity:0} 100%{opacity:0}} .pk{animation:pk 14s linear infinite} @keyframes gl{0%{opacity:0} 51%{opacity:0} 52%{opacity:1} 96%{opacity:1} 97.5%{opacity:0} 100%{opacity:0}} .gl{animation:gl 14s linear infinite} @keyframes gc{0%{opacity:0} 57%{opacity:0} 58%{opacity:1} 96%{opacity:1} 97.5%{opacity:0} 100%{opacity:0}} .gc{animation:gc 14s linear infinite} @keyframes gd{0%{opacity:0} 65%{opacity:0} 66%{opacity:1} 96%{opacity:1} 97.5%{opacity:0} 100%{opacity:0}} .gd{animation:gd 14s linear infinite} @keyframes gr{0%{opacity:0} 83%{opacity:0} 84%{opacity:1} 96%{opacity:1} 97.5%{opacity:0} 100%{opacity:0}} .gr{animation:gr 14s linear infinite} @keyframes pp{0%{transform:translate(0,0);opacity:0} 21%{transform:translate(0,0);opacity:0} 22%{transform:translate(0,0);opacity:1} 33%{transform:translate(76px,12px);opacity:1} 35%{transform:translate(76px,12px);opacity:0} 100%{opacity:0}} .pp{animation:pp 14s ease-in-out infinite} @keyframes gp{0%{transform:translate(76px,-88px);opacity:0} 71%{transform:translate(76px,-88px);opacity:0} 72%{transform:translate(76px,-88px);opacity:1} 83%{transform:translate(0,0);opacity:1} 85%{transform:translate(0,0);opacity:0} 100%{opacity:0}} .gp{animation:gp 14s ease-in-out infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important} .fin{opacity:1!important}}</style>
<rect width="900" height="440" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Put and get: every request names its collection, then its document</text>

<rect x="30" y="60" width="400" height="330" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="84" fill="#8b949e" font-size="12" font-weight="700">YOUR PAGE</text>

<text x="46" y="112" fill="#8b949e" font-size="12">PUT: write a document</text>
<rect x="42" y="120" width="376" height="54" rx="6" fill="#0d1117" stroke="#30363d"/>
<rect x="42" y="120" width="376" height="54" rx="6" fill="none" stroke="#3fb950" stroke-width="2" class="a pl"/>
<text x="54" y="142" fill="#e6edf3">setDoc(doc(database, <tspan fill="#388bfd">"tastes"</tspan>,</text>
<text x="54" y="162" fill="#e6edf3">  <tspan fill="#f0883e">"games"</tspan>), { rating: 9 })</text>

<text x="46" y="212" fill="#8b949e" font-size="12">GET: read a document</text>
<rect x="42" y="220" width="376" height="54" rx="6" fill="#0d1117" stroke="#30363d"/>
<rect x="42" y="220" width="376" height="54" rx="6" fill="none" stroke="#a371f7" stroke-width="2" class="a gl"/>
<text x="54" y="242" fill="#e6edf3">getDoc(doc(database, <tspan fill="#388bfd">"tastes"</tspan>,</text>
<text x="54" y="262" fill="#e6edf3">  <tspan fill="#f0883e">"games"</tspan>))</text>

<text x="46" y="312" fill="#8b949e" font-size="12">what came back</text>
<rect x="42" y="320" width="376" height="54" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="54" y="352" fill="#3fb950" class="a pk">saved: tastes/games</text>
<text x="54" y="352" fill="#a371f7" class="a gr fin">{ favorite: "Wordle", rating: 9 }</text>

<rect x="470" y="60" width="400" height="330" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="486" y="84" fill="#8b949e" font-size="12" font-weight="700">FIRESTORE</text>

<rect x="486" y="98" width="368" height="170" rx="8" fill="none" stroke="#30363d" stroke-width="1.5"/>
<rect x="486" y="98" width="368" height="170" rx="8" fill="none" stroke="#388bfd" stroke-width="2.5" class="a pc"/>
<rect x="486" y="98" width="368" height="170" rx="8" fill="none" stroke="#388bfd" stroke-width="2.5" class="a gc fin"/>
<text x="500" y="122" fill="#388bfd" font-weight="700">tastes<tspan fill="#8b949e" font-weight="400">  collection</tspan></text>
<rect x="500" y="136" width="150" height="46" rx="6" fill="#0d1117" stroke="#30363d"/><text x="512" y="156" fill="#e6edf3">games</text><text x="512" y="173" fill="#8b949e" font-size="11">favorite, rating</text>
<rect x="500" y="136" width="150" height="46" rx="6" fill="none" stroke="#f0883e" stroke-width="2.5" class="a pd"/>
<rect x="500" y="136" width="150" height="46" rx="6" fill="none" stroke="#f0883e" stroke-width="2.5" class="a gd fin"/>
<rect x="664" y="136" width="150" height="46" rx="6" fill="#0d1117" stroke="#30363d"/><text x="676" y="156" fill="#e6edf3">websites</text><text x="676" y="173" fill="#8b949e" font-size="11">favorite, why</text>
<rect x="500" y="196" width="150" height="46" rx="6" fill="#0d1117" stroke="#30363d"/><text x="512" y="216" fill="#e6edf3">wishes</text><text x="512" y="233" fill="#8b949e" font-size="11">list</text>
<text x="664" y="224" fill="#8b949e" font-size="11">not named, not touched</text>

<rect x="486" y="284" width="368" height="92" rx="8" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="500" y="308" fill="#8b949e" font-weight="700">scores<tspan font-weight="400">  collection</tspan></text>
<rect x="500" y="318" width="150" height="46" rx="6" fill="#0d1117" stroke="#30363d"/><text x="512" y="338" fill="#e6edf3">high-score</text><text x="512" y="355" fill="#8b949e" font-size="11">points</text>
<text x="664" y="346" fill="#8b949e" font-size="11">not named, not touched</text>

<text x="640" y="88" fill="#388bfd" font-size="12" class="a pc">1. find the collection</text>
<text x="640" y="88" fill="#388bfd" font-size="12" class="a gc">1. find the collection</text>

<circle cx="424" cy="147" r="8" fill="#3fb950" class="a pp"/>
<circle cx="424" cy="247" r="8" fill="#a371f7" class="a gp"/>

<text x="30" y="420" fill="#8b949e" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2. find the document by its name.  3. write it (put) or bring its fields back (get). Nothing else is read or changed.</text>
</svg>

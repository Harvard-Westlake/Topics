<rect x="44" y="432" width="387" height="48" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="56" y="451" fill="#e6edf3" font-size="11">To see a change, the browser has to keep asking.</text>
<text x="56" y="468" fill="#8b949e" font-size="10.5">Used for pages, images, forms, saving and loading data.</text>
<rect x="479" y="432" width="387" height="48" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="491" y="451" fill="#e6edf3" font-size="11">The server can push the instant something changes.</text>
<text x="491" y="468" fill="#8b949e" font-size="10.5">Used for chat, multiplayer games, live scores.</text>

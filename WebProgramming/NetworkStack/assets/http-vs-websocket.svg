<rect width="910" height="510" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">Application layer: HTTP asks and answers, a WebSocket stays open</text>
<text x="30" y="56" fill="#8b949e" font-size="12">Both are messages inside TCP. The difference is who is allowed to speak, and when.</text>
<text x="237" y="240" text-anchor="middle" fill="#8b949e" font-size="10.5" class="gap2">nothing happens until the browser asks again</text>
<text x="237" y="333" text-anchor="middle" fill="#8b949e" font-size="10.5" class="gap5">nothing happens until the browser asks again</text>
<rect x="30" y="74" width="415" height="418" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="46" y="98" fill="#388bfd" font-size="14" font-weight="700">HTTP: one question, one answer</text>
<text x="46" y="115" fill="#8b949e" font-size="11">The browser always speaks first.</text>

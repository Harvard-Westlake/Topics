<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 510" width="910" height="510" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>Animated comparison of HTTP and WebSocket. HTTP: the browser sends GET /scores and gets 200 OK with the scores, then must ask again and again to learn whether anything changed. WebSocket: the browser sends one GET with Upgrade: websocket, the server answers 101 Switching Protocols, the connection stays open, and after that the server and the browser each send messages whenever they have one.</title>

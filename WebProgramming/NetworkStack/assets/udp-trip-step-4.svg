<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 418" width="910" height="418" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>UDP step 4: use the chunks as they land</title>
<style>@keyframes o1{0%,10%{opacity:1;transform:translate(345px,140px)}10.5%{opacity:1;transform:translate(345px,140px)}24.0%{opacity:1;transform:translate(359px,214px)}25.5%,100%{opacity:1;transform:translate(359px,214px)}} .o1{opacity:1;transform:translate(359px,214px);animation:o1 10s linear infinite} @keyframes o0{0%,26%{opacity:1;transform:translate(455px,140px)}26.5%{opacity:1;transform:translate(455px,140px)}40.0%{opacity:1;transform:translate(455px,214px)}41.5%,100%{opacity:1;transform:translate(455px,214px)}} .o0{opacity:1;transform:translate(455px,214px);animation:o0 10s linear infinite} @keyframes o3{0%,42%{opacity:1;transform:translate(565px,140px)}42.5%{opacity:1;transform:translate(565px,140px)}56.0%{opacity:1;transform:translate(551px,214px)}57.5%,100%{opacity:1;transform:translate(551px,214px)}} .o3{opacity:1;transform:translate(551px,214px);animation:o3 10s linear infinite} @keyframes bad{0%,64%{opacity:0}66%,96%{opacity:1}100%{opacity:0}} .bad{animation:bad 10s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="418" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#3fb950" font-size="12" font-weight="700">UDP, step 4 of 5</text>
<text x="30" y="58" fill="#e6edf3" font-size="17" font-weight="700">Use them as they land</text>
<text x="880" y="58" text-anchor="end" fill="#8b949e" font-size="11">inside your browser</text>
<g>
<rect x="30" y="84" width="150" height="192" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="105" y="106" text-anchor="middle" fill="#388bfd" font-size="12.5" font-weight="700">Your browser</text>
</g>
<g opacity=".28">
<rect x="730" y="84" width="150" height="192" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="805" y="106" text-anchor="middle" fill="#388bfd" font-size="12.5" font-weight="700">Web server</text>
</g>
<text x="455" y="112" text-anchor="middle" fill="#8b949e" font-size="11">as they arrived</text>
<g class="o1">
<rect x="-48.0" y="-17.0" width="96" height="34" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;h1&gt;Hi!&lt;/h1&gt;</text>
</g>
<g class="o0">
<rect x="-48.0" y="-17.0" width="96" height="34" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;html&gt;</text>
</g>
<g class="o3">
<rect x="-48.0" y="-17.0" width="96" height="34" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;/html&gt;</text>
</g>
<g class="bad">
<text x="455" y="256" text-anchor="middle" fill="#f85149" font-size="12" font-weight="700">Wrong order, one chunk gone, and nobody asks for it again.</text>
<text x="105" y="180" text-anchor="middle" fill="#f85149" font-size="12" font-weight="700">a broken</text>
<text x="105" y="198" text-anchor="middle" fill="#f85149" font-size="12" font-weight="700">page</text>
</g>
<line x1="30" y1="300" x2="880" y2="300" stroke="#30363d" stroke-width="1"/>
<text x="30" y="322" fill="#e6edf3" font-size="12.5" font-weight="700">This stage is the work of the Application and Transport layers.</text>
<text x="880" y="322" text-anchor="end" fill="#8b949e" font-size="11">Every packet is a nest: each layer wraps the one inside it.</text>
<g opacity="0.32">
<rect x="30" y="334" width="850" height="70" rx="5" fill="#161b22" stroke="#a371f7" stroke-width="1.2"/>
<text x="40" y="364" fill="#a371f7" font-size="10.5" font-weight="700">Link frame</text>
<text x="40" y="379" fill="#e6edf3" font-size="10">to the next hop</text>
</g>
<g opacity="0.32">
<rect x="190" y="341" width="682" height="56" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.2"/>
<text x="200" y="364" fill="#f0883e" font-size="10.5" font-weight="700">IP packet</text>
<text x="200" y="379" fill="#e6edf3" font-size="10">to: your browser</text>
</g>
<g opacity="1">
<rect x="350" y="348" width="514" height="42" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="2.2"/>
<text x="360" y="364" fill="#3fb950" font-size="10.5" font-weight="700">UDP datagram</text>
<text x="360" y="379" fill="#e6edf3" font-size="10">no number to sort by</text>
</g>
<g opacity="1">
<rect x="560" y="355" width="296" height="28" rx="5" fill="#1c2330" stroke="#388bfd" stroke-width="2.2"/>
<text x="708.0" y="373" text-anchor="middle" fill="#388bfd" font-size="10.5" font-weight="700">The data: chunks, in arrival order</text>
</g>
</svg>

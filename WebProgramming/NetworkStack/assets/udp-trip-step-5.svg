<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 418" width="910" height="418" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>UDP step 5: why anyone uses it</title>
<style>@keyframes u0{0%,6%{opacity:0}8%,96%{opacity:1}100%{opacity:0}} .u0{animation:u0 10s linear infinite} @keyframes u1{0%,22%{opacity:0}24%,96%{opacity:1}100%{opacity:0}} .u1{animation:u1 10s linear infinite} @keyframes u3{0%,54%{opacity:0}56%,96%{opacity:1}100%{opacity:0}} .u3{animation:u3 10s linear infinite} @keyframes u4{0%,70%{opacity:0}72%,96%{opacity:1}100%{opacity:0}} .u4{animation:u4 10s linear infinite} @keyframes t0{0%,6%{opacity:0}8%,96%{opacity:1}100%{opacity:0}} .t0{animation:t0 10s linear infinite} @keyframes t1{0%,22%{opacity:0}24%,96%{opacity:1}100%{opacity:0}} .t1{animation:t1 10s linear infinite} @keyframes t2{0%,54%{opacity:0}56%,96%{opacity:1}100%{opacity:0}} .t2{animation:t2 10s linear infinite} @keyframes t3{0%,70%{opacity:0}72%,96%{opacity:1}100%{opacity:0}} .t3{animation:t3 10s linear infinite} @keyframes glitch{0%,38%{opacity:0}40%,96%{opacity:1}100%{opacity:0}} .glitch{animation:glitch 10s linear infinite} @keyframes frozen{0%,38%{opacity:0}40%,96%{opacity:1}100%{opacity:0}} .frozen{animation:frozen 10s linear infinite} @keyframes moral{0%,80%{opacity:0}82%,96%{opacity:1}100%{opacity:0}} .moral{animation:moral 10s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="418" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#3fb950" font-size="12" font-weight="700">UDP, step 5 of 5</text>
<text x="30" y="58" fill="#e6edf3" font-size="17" font-weight="700">So why does anyone use it?</text>
<text x="880" y="58" text-anchor="end" fill="#8b949e" font-size="11">a live video call, one picture at a time</text>
<text x="250" y="96" text-anchor="middle" fill="#8b949e" font-size="10">now</text>
<text x="810" y="96" text-anchor="middle" fill="#8b949e" font-size="10">later</text>
<line x1="280" y1="92" x2="780" y2="92" stroke="#8b949e" stroke-width="1" marker-end="url(#m8b949e)"/>
<rect x="30" y="108" width="850" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="46" y="138" fill="#e3b341" font-size="14" font-weight="700">UDP</text>
<text x="46" y="157" fill="#e6edf3" font-size="10.5">skips what is lost</text>
<rect x="30" y="192" width="850" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="46" y="222" fill="#3fb950" font-size="14" font-weight="700">TCP</text>
<text x="46" y="241" fill="#e6edf3" font-size="10.5">waits for what is lost</text>
<g class="u0">
<rect x="198" y="122" width="104" height="40" rx="5" fill="#1c2330" stroke="#e3b341" stroke-width="1.5"/>
<text x="250" y="146" text-anchor="middle" fill="#e6edf3" font-size="11">picture 1</text>
</g>
<g class="u1">
<rect x="338" y="122" width="104" height="40" rx="5" fill="#1c2330" stroke="#e3b341" stroke-width="1.5"/>
<text x="390" y="146" text-anchor="middle" fill="#e6edf3" font-size="11">picture 2</text>
</g>
<g class="u3">
<rect x="618" y="122" width="104" height="40" rx="5" fill="#1c2330" stroke="#e3b341" stroke-width="1.5"/>
<text x="670" y="146" text-anchor="middle" fill="#e6edf3" font-size="11">picture 4</text>
</g>
<g class="u4">
<rect x="758" y="122" width="104" height="40" rx="5" fill="#1c2330" stroke="#e3b341" stroke-width="1.5"/>
<text x="810" y="146" text-anchor="middle" fill="#e6edf3" font-size="11">picture 5</text>
</g>
<g class="t0">
<rect x="198" y="206" width="104" height="40" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="250" y="230" text-anchor="middle" fill="#e6edf3" font-size="11">picture 1</text>
</g>
<g class="t1">
<rect x="338" y="206" width="104" height="40" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="390" y="230" text-anchor="middle" fill="#e6edf3" font-size="11">picture 2</text>
</g>
<g class="t2">
<rect x="618" y="206" width="104" height="40" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="670" y="230" text-anchor="middle" fill="#e6edf3" font-size="11">picture 3</text>
</g>
<g class="t3">
<rect x="758" y="206" width="104" height="40" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="810" y="230" text-anchor="middle" fill="#e6edf3" font-size="11">picture 4</text>
</g>
<text x="530" y="146" text-anchor="middle" fill="#8b949e" font-size="11" class="glitch">skipped</text>
<text x="530" y="230" text-anchor="middle" fill="#f85149" font-size="11" font-weight="700" class="frozen">frozen, waiting...</text>
<text x="455" y="282" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700" class="moral">UDP: one tiny glitch, and still live.   TCP: every picture, and now behind.</text>
<line x1="30" y1="300" x2="880" y2="300" stroke="#30363d" stroke-width="1"/>
<text x="30" y="322" fill="#e6edf3" font-size="12.5" font-weight="700">This stage is the work of the Application and Transport layers.</text>
<text x="880" y="322" text-anchor="end" fill="#8b949e" font-size="11">Every packet is a nest: each layer wraps the one inside it.</text>
<g opacity="0.32">
<rect x="30" y="334" width="850" height="70" rx="5" fill="#161b22" stroke="#a371f7" stroke-width="1.2"/>
<text x="40" y="364" fill="#a371f7" font-size="10.5" font-weight="700">Link frame</text>
<text x="40" y="379" fill="#e6edf3" font-size="10">to the next hop</text>
</g>
<g opacity="0.32">
<rect x="190" y="341" width="682" height="56" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.2"/>
<text x="200" y="364" fill="#f0883e" font-size="10.5" font-weight="700">IP packet</text>
<text x="200" y="379" fill="#e6edf3" font-size="10">to: your browser</text>
</g>
<g opacity="1">
<rect x="350" y="348" width="514" height="42" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="2.2"/>
<text x="360" y="364" fill="#3fb950" font-size="10.5" font-weight="700">UDP datagram</text>
<text x="360" y="379" fill="#e6edf3" font-size="10">port only, no number</text>
</g>
<g opacity="1">
<rect x="560" y="355" width="296" height="28" rx="5" fill="#1c2330" stroke="#388bfd" stroke-width="2.2"/>
<text x="708.0" y="373" text-anchor="middle" fill="#388bfd" font-size="10.5" font-weight="700">The data: one picture of the call</text>
</g>
</svg>

<rect x="-49.0" y="-13.0" width="98" height="26" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;h1&gt;Hi!&lt;/h1&gt;</text>
<circle cx="-49.0" cy="-13.0" r="10" fill="#3fb950"/>
<text x="-49.0" y="-9.0" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="700">2</text>
</g>
<g class="p3">
<rect x="-49.0" y="-13.0" width="98" height="26" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;/html&gt;</text>
<circle cx="-49.0" cy="-13.0" r="10" fill="#3fb950"/>
<text x="-49.0" y="-9.0" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="700">4</text>
</g>
<g class="p2">
<rect x="-49.0" y="-13.0" width="98" height="26" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;p&gt;...&lt;/p&gt;</text>
<circle cx="-49.0" cy="-13.0" r="10" fill="#3fb950"/>

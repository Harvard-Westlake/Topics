<text x="560" y="131" text-anchor="middle" fill="#f85149" font-size="17" font-weight="700">✕</text>
<text x="584" y="130" fill="#f85149" font-size="11" font-weight="700">one never arrives</text>
</g>
<line x1="30" y1="300" x2="880" y2="300" stroke="#30363d" stroke-width="1"/>
<text x="30" y="322" fill="#e6edf3" font-size="12.5" font-weight="700">This stage is the work of the Internet and Link layers.</text>
<text x="880" y="322" text-anchor="end" fill="#8b949e" font-size="11">Every packet is a nest: each layer wraps the one inside it.</text>
<g opacity="1">
<rect x="30" y="334" width="850" height="70" rx="5" fill="#1c2330" stroke="#a371f7" stroke-width="2.2"/>
<text x="40" y="364" fill="#a371f7" font-size="10.5" font-weight="700">Link frame</text>
<text x="40" y="379" fill="#e6edf3" font-size="10">to the next hop</text>
</g>
<g opacity="1">
<rect x="190" y="341" width="682" height="56" rx="5" fill="#1c2330" stroke="#f0883e" stroke-width="2.2"/>
<text x="200" y="364" fill="#f0883e" font-size="10.5" font-weight="700">IP packet</text>
<text x="200" y="379" fill="#e6edf3" font-size="10">to: your browser</text>
</g>
<g opacity="0.32">

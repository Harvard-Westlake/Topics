<line x1="455" y1="240" x2="180" y2="180" stroke="#30363d" stroke-width="1.4" stroke-dasharray="4 5"/>
<circle cx="560" cy="126" r="15" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
<text x="560" y="104" text-anchor="middle" fill="#f0883e" font-size="10">router</text>
<circle cx="350" cy="126" r="15" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
<text x="350" y="104" text-anchor="middle" fill="#f0883e" font-size="10">router</text>
<circle cx="455" cy="240" r="15" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
<text x="455" y="272" text-anchor="middle" fill="#f0883e" font-size="10">router</text>
<text x="105" y="262" text-anchor="middle" fill="#8b949e" font-size="10">arrived in this order</text>
<text x="805" y="150" text-anchor="middle" fill="#8b949e" font-size="10.5">sends all four</text>
<g class="p0">
<rect x="-49.0" y="-13.0" width="98" height="26" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;html&gt;</text>

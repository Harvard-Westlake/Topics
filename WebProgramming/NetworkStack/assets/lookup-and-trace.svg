<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 328" width="910" height="328" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>A terminal showing two commands. nslookup web.app answers with the address 199.36.158.100. traceroute web.app lists five hops: the Wi-Fi router, the internet provider, a router that refuses to answer and shows three stars, a big network between providers, and the server at 199.36.158.100.</title>
<style> @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="328" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">Look up the name, then follow the hops</text>
<text x="30" y="56" fill="#8b949e" font-size="12">Example output. Your addresses, times, and number of hops will be different.</text>
<rect x="30" y="76" width="850" height="234" rx="8" fill="#010409" stroke="#30363d" stroke-width="1"/>
<text x="44" y="95" fill="#8b949e" font-size="10.5">terminal</text>
<line x1="30" y1="104" x2="880" y2="104" stroke="#30363d" stroke-width="1"/>
<text x="44" y="124" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">$ nslookup web.app</text>
<text x="866" y="124" text-anchor="end" fill="#388bfd" font-size="11">ask a name server</text>
<text x="44" y="143" fill="#8b949e" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">Name:     web.app</text>
<text x="44" y="162" fill="#3fb950" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">Address:  199.36.158.100</text>
<text x="866" y="162" text-anchor="end" fill="#388bfd" font-size="11">the number packets are sent to</text>
<text x="44" y="181" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"></text>
<text x="44" y="200" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">$ traceroute web.app</text>
<text x="866" y="200" text-anchor="end" fill="#f0883e" font-size="11">list every router on the way</text>
<text x="44" y="219" fill="#f0883e" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"> 1  192.168.1.1        2 ms</text>
<text x="866" y="219" text-anchor="end" fill="#8b949e" font-size="11">your Wi-Fi router</text>
<text x="44" y="238" fill="#f0883e" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"> 2  10.20.0.1          9 ms</text>
<text x="866" y="238" text-anchor="end" fill="#8b949e" font-size="11">your internet provider</text>
<text x="44" y="257" fill="#8b949e" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"> 3  * * *</text>
<text x="866" y="257" text-anchor="end" fill="#8b949e" font-size="11">a router that refuses to answer</text>
<text x="44" y="276" fill="#f0883e" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"> 4  72.14.215.85      13 ms</text>
<text x="866" y="276" text-anchor="end" fill="#8b949e" font-size="11">a big network between providers</text>
<text x="44" y="295" fill="#3fb950" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"> 5  199.36.158.100    15 ms</text>
<text x="866" y="295" text-anchor="end" fill="#8b949e" font-size="11">the server: same address as above</text>
</svg>

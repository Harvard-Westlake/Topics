<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 456" width="910" height="456" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>Animated diagram of a DNS lookup for my-site.web.app. Step 1: the browser asks a resolver. Step 2: the resolver asks a root name server, which says to ask the .app servers. Step 3: the .app name server says to ask web.app's name server. Step 4: web.app's name server answers 199.36.158.100. Step 5: the resolver hands that address back to the browser.</title>
<style>@keyframes ans{0%,80%{opacity:0.1}82%,96%{opacity:1}100%{opacity:0.1}} .ans{animation:ans 16s linear infinite} @keyframes q1{0%{opacity:0;transform:translate(0,0)}4%{opacity:0;transform:translate(0,0)}4.5%{opacity:1}12%{opacity:1;transform:translate(90px,0px)}13%,100%{opacity:0;transform:translate(90px,0px)}} .q1{opacity:0;animation:q1 16s linear infinite} @keyframes q5{0%{opacity:0;transform:translate(0,0)}70%{opacity:0;transform:translate(0,0)}70.5%{opacity:1}78%{opacity:1;transform:translate(-90px,0px)}79%,100%{opacity:0;transform:translate(-90px,0px)}} .q5{opacity:0;animation:q5 16s linear infinite} @keyframes s0{0%,23%{opacity:0.1}25%,96%{opacity:1}100%{opacity:0.1}} .s0{animation:s0 16s linear infinite} @keyframes q2{0%{opacity:0;transform:translate(0,0)}15%{opacity:0;transform:translate(0,0)}15.5%{opacity:1}23.0%{opacity:1;transform:translate(160px,-101px)}31%{opacity:1;transform:translate(0,0)}32%,100%{opacity:0;transform:translate(0,0)}} .q2{opacity:0;animation:q2 16s linear infinite} @keyframes s1{0%,41%{opacity:0.1}43%,96%{opacity:1}100%{opacity:0.1}} .s1{animation:s1 16s linear infinite} @keyframes q3{0%{opacity:0;transform:translate(0,0)}33%{opacity:0;transform:translate(0,0)}33.5%{opacity:1}41.0%{opacity:1;transform:translate(160px,0px)}49%{opacity:1;transform:translate(0,0)}50%,100%{opacity:0;transform:translate(0,0)}} .q3{opacity:0;animation:q3 16s linear infinite} @keyframes s2{0%,59%{opacity:0.1}61%,96%{opacity:1}100%{opacity:0.1}} .s2{animation:s2 16s linear infinite} @keyframes q4{0%{opacity:0;transform:translate(0,0)}51%{opacity:0;transform:translate(0,0)}51.5%{opacity:1}59.0%{opacity:1;transform:translate(160px,101px)}67%{opacity:1;transform:translate(0,0)}68%,100%{opacity:0;transform:translate(0,0)}} .q4{opacity:0;animation:q4 16s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="456" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">Name servers: turning a name into a number</text>
<text x="30" y="56" fill="#8b949e" font-size="12">Packets need an IP address, but people type names. DNS is the lookup, and no single server knows every answer.</text>
<rect x="30" y="190" width="170" height="80" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="115" y="213" text-anchor="middle" fill="#388bfd" font-size="13" font-weight="700">Your browser</text>
<text x="115" y="232" text-anchor="middle" fill="#e6edf3" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">my-site.web.app ?</text>
<text x="115" y="254" text-anchor="middle" fill="#3fb950" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" class="ans">199.36.158.100</text>
<rect x="290" y="190" width="190" height="80" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
<text x="385" y="213" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="700">Resolver</text>
<text x="385" y="232" text-anchor="middle" fill="#e6edf3" font-size="11">does the asking for you</text>
<text x="385" y="250" text-anchor="middle" fill="#8b949e" font-size="10.5">run by your ISP, or 8.8.8.8</text>
<line x1="200" y1="222" x2="288" y2="222" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
<line x1="290" y1="244" x2="202" y2="244" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
<text x="245" y="214" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="700">1</text>
<text x="245" y="262" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="700">5</text>
<circle class="q1" cx="200" cy="222" r="5" fill="#e6edf3"/>
<circle class="q5" cx="290" cy="244" r="5" fill="#3fb950"/>
<rect x="640" y="92" width="240" height="74" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="656" y="113" fill="#388bfd" font-size="12.5" font-weight="700">Root name server</text>
<text x="656" y="130" fill="#8b949e" font-size="10.5">knows who runs every ending</text>
<g class="s0">
<text x="656" y="150" fill="#8b949e" font-size="10.5">says:</text>
<text x="690" y="150" fill="#e6edf3" font-size="11" font-weight="700">ask the .app servers</text>
</g>
<line x1="480" y1="230" x2="638" y2="129" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
<text x="560" y="171.5" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="700">2</text>
<circle class="q2" cx="480" cy="230" r="5" fill="#e6edf3"/>
<rect x="640" y="193" width="240" height="74" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="656" y="214" fill="#388bfd" font-size="12.5" font-weight="700">.app name server</text>
<text x="656" y="231" fill="#8b949e" font-size="10.5">knows every name ending in .app</text>
<g class="s1">
<text x="656" y="251" fill="#8b949e" font-size="10.5">says:</text>
<text x="690" y="251" fill="#e6edf3" font-size="11" font-weight="700">ask web.app's name server</text>
</g>
<line x1="480" y1="230" x2="638" y2="230" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
<text x="560" y="222.0" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="700">3</text>
<circle class="q3" cx="480" cy="230" r="5" fill="#e6edf3"/>
<rect x="640" y="294" width="240" height="74" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="656" y="315" fill="#388bfd" font-size="12.5" font-weight="700">web.app's name server</text>
<text x="656" y="332" fill="#8b949e" font-size="10.5">holds the real records</text>
<g class="s2">
<text x="656" y="352" fill="#8b949e" font-size="10.5">says:</text>
<text x="690" y="352" fill="#3fb950" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">199.36.158.100</text>
</g>
<line x1="480" y1="230" x2="638" y2="331" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
<text x="560" y="272.5" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="700">4</text>
<circle class="q4" cx="480" cy="230" r="5" fill="#e6edf3"/>
<rect x="30" y="392" width="850" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="46" y="411" fill="#e6edf3" font-size="11.5">The resolver remembers the answer for a while (a cache), so the next lookup skips steps 2 to 4.</text>
<text x="46" y="428" fill="#8b949e" font-size="11">A DNS question is one small message and one small answer, so it usually travels by UDP.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 418" width="910" height="418" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>TCP step 1: say hello first</title>
<style>@keyframes a{0%,5%{opacity:0.12}7%,96%{opacity:1}100%{opacity:0.12}} .a{animation:a 9s linear infinite} @keyframes ad{0%{opacity:0;transform:translate(0,0)}5%{opacity:0;transform:translate(0,0)}5.5%{opacity:1}23%{opacity:1;transform:translate(530px,0px)}24%,100%{opacity:0;transform:translate(530px,0px)}} .ad{opacity:0;animation:ad 9s linear infinite} @keyframes b{0%,30%{opacity:0.12}32%,96%{opacity:1}100%{opacity:0.12}} .b{animation:b 9s linear infinite} @keyframes bd{0%{opacity:0;transform:translate(0,0)}30%{opacity:0;transform:translate(0,0)}30.5%{opacity:1}48%{opacity:1;transform:translate(-530px,0px)}49%,100%{opacity:0;transform:translate(-530px,0px)}} .bd{opacity:0;animation:bd 9s linear infinite} @keyframes c{0%,55%{opacity:0.12}57%,96%{opacity:1}100%{opacity:0.12}} .c{animation:c 9s linear infinite} @keyframes cd{0%{opacity:0;transform:translate(0,0)}55%{opacity:0;transform:translate(0,0)}55.5%{opacity:1}73%{opacity:1;transform:translate(530px,0px)}74%,100%{opacity:0;transform:translate(530px,0px)}} .cd{opacity:0;animation:cd 9s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="m388bfd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#388bfd"/></marker><marker id="m3fb950" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker></defs>
<rect width="910" height="418" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#3fb950" font-size="12" font-weight="700">TCP, step 1 of 8</text>
<text x="30" y="58" fill="#e6edf3" font-size="17" font-weight="700">Say hello first</text>
<text x="880" y="58" text-anchor="end" fill="#8b949e" font-size="11">nothing is sent until both sides agree to talk</text>
<g>
<rect x="30" y="84" width="150" height="192" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="105" y="106" text-anchor="middle" fill="#388bfd" font-size="12.5" font-weight="700">Your browser</text>
</g>
<g>
<rect x="730" y="84" width="150" height="192" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="805" y="106" text-anchor="middle" fill="#388bfd" font-size="12.5" font-weight="700">Web server</text>
</g>
<g class="a">
<line x1="190" y1="140" x2="720" y2="140" stroke="#388bfd" stroke-width="1.6" marker-end="url(#m388bfd)"/>
<text x="455" y="132" text-anchor="middle" fill="#e6edf3" font-size="12">Hello. Can we talk?</text>
</g>
<circle class="ad" cx="190" cy="140" r="5" fill="#388bfd"/>
<g class="b">
<line x1="720" y1="190" x2="190" y2="190" stroke="#3fb950" stroke-width="1.6" marker-end="url(#m3fb950)"/>
<text x="455" y="182" text-anchor="middle" fill="#e6edf3" font-size="12">Yes. I am listening.</text>
</g>
<circle class="bd" cx="720" cy="190" r="5" fill="#3fb950"/>
<g class="c">
<line x1="190" y1="240" x2="720" y2="240" stroke="#388bfd" stroke-width="1.6" marker-end="url(#m388bfd)"/>
<text x="455" y="232" text-anchor="middle" fill="#e6edf3" font-size="12">Good. Here comes my question.</text>
</g>
<circle class="cd" cx="190" cy="240" r="5" fill="#388bfd"/>
<line x1="30" y1="300" x2="880" y2="300" stroke="#30363d" stroke-width="1"/>
<text x="30" y="322" fill="#e6edf3" font-size="12.5" font-weight="700">This stage is the work of the Transport layer.</text>
<text x="880" y="322" text-anchor="end" fill="#8b949e" font-size="11">Every packet is a nest: each layer wraps the one inside it.</text>
<g opacity="0.32">
<rect x="30" y="334" width="850" height="70" rx="5" fill="#161b22" stroke="#a371f7" stroke-width="1.2"/>
<text x="40" y="364" fill="#a371f7" font-size="10.5" font-weight="700">Link frame</text>
<text x="40" y="379" fill="#e6edf3" font-size="10">to the next hop</text>
</g>
<g opacity="0.32">
<rect x="190" y="341" width="682" height="56" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.2"/>
<text x="200" y="364" fill="#f0883e" font-size="10.5" font-weight="700">IP packet</text>
<text x="200" y="379" fill="#e6edf3" font-size="10">to: your browser</text>
</g>
<g opacity="1">
<rect x="350" y="348" width="514" height="42" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="2.2"/>
<text x="360" y="364" fill="#3fb950" font-size="10.5" font-weight="700">TCP segment</text>
<text x="360" y="379" fill="#e6edf3" font-size="10">hello: no page data yet</text>
</g>
<g opacity="0.32">
<rect x="560" y="355" width="296" height="28" rx="5" fill="#161b22" stroke="#388bfd" stroke-width="1.2"/>
<text x="708.0" y="373" text-anchor="middle" fill="#e6edf3" font-size="10.5">HTTP message: (empty)</text>
</g>
</svg>

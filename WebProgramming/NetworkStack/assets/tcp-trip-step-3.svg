<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 418" width="910" height="418" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>TCP step 3: cut the page into chunks</title>
<style>@keyframes cut{0%,10%{opacity:0}12%,34%{opacity:1}36%,100%{opacity:0}} .cut{opacity:0;animation:cut 9s linear infinite} @keyframes s0{0%,36%{opacity:1;transform:translate(311.0px,180px)}36.5%{opacity:1;transform:translate(311.0px,180px)}58.0%{opacity:1;transform:translate(278.0px,180px)}59.5%,100%{opacity:1;transform:translate(278.0px,180px)}} .s0{opacity:1;transform:translate(278.0px,180px);animation:s0 9s linear infinite} @keyframes s1{0%,36%{opacity:1;transform:translate(407.0px,180px)}36.5%{opacity:1;transform:translate(407.0px,180px)}58.0%{opacity:1;transform:translate(396.0px,180px)}59.5%,100%{opacity:1;transform:translate(396.0px,180px)}} .s1{opacity:1;transform:translate(396.0px,180px);animation:s1 9s linear infinite} @keyframes s2{0%,36%{opacity:1;transform:translate(503.0px,180px)}36.5%{opacity:1;transform:translate(503.0px,180px)}58.0%{opacity:1;transform:translate(514.0px,180px)}59.5%,100%{opacity:1;transform:translate(514.0px,180px)}} .s2{opacity:1;transform:translate(514.0px,180px);animation:s2 9s linear infinite} @keyframes s3{0%,36%{opacity:1;transform:translate(599.0px,180px)}36.5%{opacity:1;transform:translate(599.0px,180px)}58.0%{opacity:1;transform:translate(632.0px,180px)}59.5%,100%{opacity:1;transform:translate(632.0px,180px)}} .s3{opacity:1;transform:translate(632.0px,180px);animation:s3 9s linear infinite} @keyframes done{0%,62%{opacity:0}64%,96%{opacity:1}100%{opacity:0}} .done{animation:done 9s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="418" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#3fb950" font-size="12" font-weight="700">TCP, step 3 of 8</text>
<text x="30" y="58" fill="#e6edf3" font-size="17" font-weight="700">Cut the page into chunks</text>
<text x="880" y="58" text-anchor="end" fill="#8b949e" font-size="11">inside the server</text>
<g opacity=".28">
<rect x="30" y="84" width="150" height="192" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="105" y="106" text-anchor="middle" fill="#388bfd" font-size="12.5" font-weight="700">Your browser</text>
</g>
<g>
<rect x="730" y="84" width="150" height="192" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="805" y="106" text-anchor="middle" fill="#388bfd" font-size="12.5" font-weight="700">Web server</text>
</g>
<text x="455" y="118" text-anchor="middle" fill="#e6edf3" font-size="12">index.html is too big to send as one piece</text>
<line x1="359" y1="146" x2="359" y2="214" stroke="#e3b341" stroke-width="2" stroke-dasharray="5 4" class="cut"/>
<line x1="455" y1="146" x2="455" y2="214" stroke="#e3b341" stroke-width="2" stroke-dasharray="5 4" class="cut"/>
<line x1="551" y1="146" x2="551" y2="214" stroke="#e3b341" stroke-width="2" stroke-dasharray="5 4" class="cut"/>
<g class="s0">
<rect x="-48.0" y="-17.0" width="96" height="34" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;html&gt;</text>
</g>
<g class="s1">
<rect x="-48.0" y="-17.0" width="96" height="34" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;h1&gt;Hi!&lt;/h1&gt;</text>
</g>
<g class="s2">
<rect x="-48.0" y="-17.0" width="96" height="34" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;p&gt;...&lt;/p&gt;</text>
</g>
<g class="s3">
<rect x="-48.0" y="-17.0" width="96" height="34" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="1.5"/>
<text x="0" y="4" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;/html&gt;</text>
</g>
<text x="455" y="250" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700" class="done">4 chunks, each small enough to travel</text>
<line x1="30" y1="300" x2="880" y2="300" stroke="#30363d" stroke-width="1"/>
<text x="30" y="322" fill="#e6edf3" font-size="12.5" font-weight="700">This stage is the work of the Transport layer.</text>
<text x="880" y="322" text-anchor="end" fill="#8b949e" font-size="11">Every packet is a nest: each layer wraps the one inside it.</text>
<g opacity="0.32">
<rect x="30" y="334" width="850" height="70" rx="5" fill="#161b22" stroke="#a371f7" stroke-width="1.2"/>
<text x="40" y="364" fill="#a371f7" font-size="10.5" font-weight="700">Link frame</text>
<text x="40" y="379" fill="#e6edf3" font-size="10">to the next hop</text>
</g>
<g opacity="0.32">
<rect x="190" y="341" width="682" height="56" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.2"/>
<text x="200" y="364" fill="#f0883e" font-size="10.5" font-weight="700">IP packet</text>
<text x="200" y="379" fill="#e6edf3" font-size="10">to: your browser</text>
</g>
<g opacity="1">
<rect x="350" y="348" width="514" height="42" rx="5" fill="#1c2330" stroke="#3fb950" stroke-width="2.2"/>
<text x="360" y="364" fill="#3fb950" font-size="10.5" font-weight="700">TCP segment</text>
<text x="360" y="379" fill="#e6edf3" font-size="10">one chunk in each segment</text>
</g>
<g opacity="0.32">
<rect x="560" y="355" width="296" height="28" rx="5" fill="#161b22" stroke="#388bfd" stroke-width="1.2"/>
<text x="708.0" y="373" text-anchor="middle" fill="#e6edf3" font-size="10.5">HTTP message: a chunk of index.html</text>
</g>
</svg>

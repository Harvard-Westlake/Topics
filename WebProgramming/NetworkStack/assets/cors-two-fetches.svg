<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 329" width="910" height="329" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>A browser console on your own site. A fetch to example.com fails with a red error saying it was blocked by CORS policy because no Access-Control-Allow-Origin header is present. A fetch to api.github.com/zen succeeds and prints a line of text, because GitHub's server sends access-control-allow-origin: star.</title>
<style> @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="329" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">Two fetches from the same page, two different results</text>
<text x="30" y="56" fill="#8b949e" font-size="12">The only difference is a header the second server chose to send.</text>
<rect x="30" y="76" width="850" height="177" rx="8" fill="#010409" stroke="#30363d" stroke-width="1"/>
<text x="44" y="95" fill="#8b949e" font-size="10.5">DevTools console, on your own site</text>
<line x1="30" y1="104" x2="880" y2="104" stroke="#30363d" stroke-width="1"/>
<text x="44" y="124" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">&gt; fetch("https://example.com")</text>
<text x="44" y="143" fill="#f85149" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  Access to fetch at 'https://example.com/' from origin</text>
<text x="44" y="162" fill="#f85149" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  'https://my-site.web.app' has been blocked by CORS policy:</text>
<text x="44" y="181" fill="#f85149" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  No 'Access-Control-Allow-Origin' header is present.</text>
<text x="866" y="181" text-anchor="end" fill="#f85149" font-size="11">blocked by your browser</text>
<text x="44" y="200" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"></text>
<text x="44" y="219" fill="#e6edf3" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">&gt; fetch("https://api.github.com/zen")</text>
<text x="44" y="238" fill="#3fb950" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  Keep it logically awesome.</text>
<text x="866" y="238" text-anchor="end" fill="#3fb950" font-size="11">allowed: the page got the text</text>
<rect x="30" y="267" width="850" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="46" y="285" fill="#e6edf3" font-size="11.5">GitHub's server sent  access-control-allow-origin: *  with its answer. The star means any origin may read it.</text>
<text x="46" y="301" fill="#8b949e" font-size="11">example.com sent no such header, so the browser kept the answer away from your page.</text>
</svg>

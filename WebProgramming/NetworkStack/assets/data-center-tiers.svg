<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 414" width="910" height="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>Animated diagram of three sizes of data center. An edge location is a few racks near your city that keeps copies of files. A data center is one building with thousands of servers. A region is several data centers linked together that holds the databases. A request to load the page makes a short trip to the edge and back. A request to save a score travels through the edge to the region and back.</title>
<style>@keyframes e1{0%{opacity:0;transform:translate(0,0)}5%{opacity:0;transform:translate(0,0)}5.5%{opacity:1}12.0%{opacity:1;transform:translate(84px,0px)}19%{opacity:1;transform:translate(0,0)}20%,100%{opacity:0;transform:translate(0,0)}} .e1{opacity:0;animation:e1 16s linear infinite} @keyframes e2{0%,30%{offset-distance:0%;opacity:0}31%{opacity:1}56%{offset-distance:50%;opacity:1}82%{offset-distance:100%;opacity:1}83%,100%{offset-distance:100%;opacity:0}} .e2{opacity:0;offset-path:path('M 126 206 L 556 206 L 126 206');animation:e2 16s linear infinite} @keyframes l1{0%,5%{opacity:0.25}7%,96%{opacity:1}100%{opacity:0.25}} .l1{animation:l1 16s linear infinite} @keyframes l2{0%,30%{opacity:0.25}32%,96%{opacity:1}100%{opacity:0.25}} .l2{animation:l2 16s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="910" height="414" rx="10" fill="#0d1117"/>
<text x="30" y="36" fill="#e6edf3" font-size="17" font-weight="700">Data centers: three sizes, three distances</text>
<text x="30" y="56" fill="#8b949e" font-size="12">Where a request is answered depends on what it needs. Copies of files sit close to you. The one true copy of the data sits far away.</text>
<rect x="30" y="176" width="96" height="60" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="78" y="203" text-anchor="middle" fill="#388bfd" font-size="13" font-weight="700">You</text>
<text x="78" y="221" text-anchor="middle" fill="#8b949e" font-size="10.5">a browser</text>
<rect x="210" y="146" width="180" height="120" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
<text x="300" y="170" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="700">Edge location</text>
<text x="300" y="190" text-anchor="middle" fill="#e6edf3" font-size="10.5">a few racks, in or near your city</text>
<text x="300" y="208" text-anchor="middle" fill="#e6edf3" font-size="10.5">keeps copies of files</text>
<text x="300" y="234" text-anchor="middle" fill="#8b949e" font-size="10.5">Firebase Hosting serves</text>
<text x="300" y="249" text-anchor="middle" fill="#8b949e" font-size="10.5">your HTML from one</text>
<rect x="480" y="88" width="400" height="236" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
<text x="680" y="112" text-anchor="middle" fill="#e3b341" font-size="14" font-weight="700">Region</text>
<text x="680" y="130" text-anchor="middle" fill="#e6edf3" font-size="10.5">several data centers, linked together</text>
<rect x="498" y="146" width="116" height="96" rx="8" fill="#0d1117" stroke="#e3b341" stroke-width="1.2"/>
<text x="556" y="168" text-anchor="middle" fill="#e3b341" font-size="11.5" font-weight="700">Data center</text>
<text x="556" y="186" text-anchor="middle" fill="#e6edf3" font-size="10">one building,</text>
<text x="556" y="200" text-anchor="middle" fill="#e6edf3" font-size="10">thousands of servers</text>
<rect x="514" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="532" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="550" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="568" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="586" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="622" y="146" width="116" height="96" rx="8" fill="#0d1117" stroke="#e3b341" stroke-width="1.2"/>
<text x="680" y="168" text-anchor="middle" fill="#e3b341" font-size="11.5" font-weight="700">Data center</text>
<text x="680" y="186" text-anchor="middle" fill="#e6edf3" font-size="10">one building,</text>
<text x="680" y="200" text-anchor="middle" fill="#e6edf3" font-size="10">thousands of servers</text>
<rect x="638" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="656" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="674" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="692" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="710" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="746" y="146" width="116" height="96" rx="8" fill="#0d1117" stroke="#e3b341" stroke-width="1.2"/>
<text x="804" y="168" text-anchor="middle" fill="#e3b341" font-size="11.5" font-weight="700">Data center</text>
<text x="804" y="186" text-anchor="middle" fill="#e6edf3" font-size="10">one building,</text>
<text x="804" y="200" text-anchor="middle" fill="#e6edf3" font-size="10">thousands of servers</text>
<rect x="762" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="780" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="798" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="816" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<rect x="834" y="212" width="12" height="20" rx="2" fill="#161b22" stroke="#30363d"/>
<text x="680" y="266" text-anchor="middle" fill="#e6edf3" font-size="10.5">runs services and holds the databases</text>
<text x="680" y="284" text-anchor="middle" fill="#8b949e" font-size="10.5">your Firestore data lives in one region</text>
<text x="680" y="302" text-anchor="middle" fill="#8b949e" font-size="10.5">if one building fails, the others carry on</text>
<line x1="126" y1="206" x2="208" y2="206" stroke="#484f58" stroke-width="2"/>
<line x1="390" y1="206" x2="478" y2="206" stroke="#484f58" stroke-width="2"/>
<circle class="e1" cx="126" cy="206" r="6" fill="#3fb950"/>
<circle class="e2" r="6" fill="#f0883e"/>
<rect x="30" y="344" width="850" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<g class="l1"><circle cx="50" cy="359" r="5" fill="#3fb950"/><text x="64" y="363" fill="#e6edf3" font-size="11.5">Load the page: answered at the edge. A short trip, a few milliseconds.</text></g>
<g class="l2"><circle cx="50" cy="380" r="5" fill="#f0883e"/><text x="64" y="384" fill="#e6edf3" font-size="11.5">Save a score: has to reach the database in the region. A long trip, often 50 to 150 milliseconds.</text></g>
</svg>

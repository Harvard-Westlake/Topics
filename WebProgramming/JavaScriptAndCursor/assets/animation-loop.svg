<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><title>The animation loop: clear the canvas, draw everything, move everything a little, ask for the next frame; on the right a ball slides across a canvas and bounces</title><style>.a{opacity:0} @keyframes k1{0%{opacity:0} 0.0%{opacity:1} 6.2%{opacity:1} 7.8%{opacity:0} 100%{opacity:0}} .k1{animation:k1 8s linear infinite} @keyframes k2{0%{opacity:0} 23.5%{opacity:0} 25.0%{opacity:1} 31.2%{opacity:1} 32.8%{opacity:0} 100%{opacity:0}} .k2{animation:k2 8s linear infinite} @keyframes k3{0%{opacity:0} 48.5%{opacity:0} 50.0%{opacity:1} 56.2%{opacity:1} 57.8%{opacity:0} 100%{opacity:0}} .k3{animation:k3 8s linear infinite} @keyframes k4{0%{opacity:0} 73.5%{opacity:0} 75.0%{opacity:1} 81.2%{opacity:1} 82.8%{opacity:0} 100%{opacity:0}} .k4{animation:k4 8s linear infinite} @keyframes k5{0%{opacity:0} 4.8%{opacity:0} 6.2%{opacity:1} 12.5%{opacity:1} 14.0%{opacity:0} 100%{opacity:0}} .k5{animation:k5 8s linear infinite} @keyframes k6{0%{opacity:0} 29.8%{opacity:0} 31.2%{opacity:1} 37.5%{opacity:1} 39.0%{opacity:0} 100%{opacity:0}} .k6{animation:k6 8s linear infinite} @keyframes k7{0%{opacity:0} 54.8%{opacity:0} 56.2%{opacity:1} 62.5%{opacity:1} 64.0%{opacity:0} 100%{opacity:0}} .k7{animation:k7 8s linear infinite} @keyframes k8{0%{opacity:0} 79.8%{opacity:0} 81.2%{opacity:1} 87.5%{opacity:1} 89.0%{opacity:0} 100%{opacity:0}} .k8{animation:k8 8s linear infinite} @keyframes k9{0%{opacity:0} 11.0%{opacity:0} 12.5%{opacity:1} 18.8%{opacity:1} 20.2%{opacity:0} 100%{opacity:0}} .k9{animation:k9 8s linear infinite} @keyframes k10{0%{opacity:0} 36.0%{opacity:0} 37.5%{opacity:1} 43.8%{opacity:1} 45.2%{opacity:0} 100%{opacity:0}} .k10{animation:k10 8s linear infinite} @keyframes k11{0%{opacity:0} 61.0%{opacity:0} 62.5%{opacity:1} 68.8%{opacity:1} 70.2%{opacity:0} 100%{opacity:0}} .k11{animation:k11 8s linear infinite} @keyframes k12{0%{opacity:0} 86.0%{opacity:0} 87.5%{opacity:1} 93.8%{opacity:1} 95.2%{opacity:0} 100%{opacity:0}} .k12{animation:k12 8s linear infinite} @keyframes k13{0%{opacity:0} 17.2%{opacity:0} 18.8%{opacity:1} 25.0%{opacity:1} 26.5%{opacity:0} 100%{opacity:0}} .k13{animation:k13 8s linear infinite} @keyframes k14{0%{opacity:0} 42.2%{opacity:0} 43.8%{opacity:1} 50.0%{opacity:1} 51.5%{opacity:0} 100%{opacity:0}} .k14{animation:k14 8s linear infinite} @keyframes k15{0%{opacity:0} 67.2%{opacity:0} 68.8%{opacity:1} 75.0%{opacity:1} 76.5%{opacity:0} 100%{opacity:0}} .k15{animation:k15 8s linear infinite} @keyframes k16{0%{opacity:0} 92.2%{opacity:0} 93.8%{opacity:1} 100.0%{opacity:1}} .k16{animation:k16 8s linear infinite} @keyframes k17{0.0%{transform:translate(0px,0px)} 50.0%{transform:translate(320px,0px)} 100.0%{transform:translate(0px,0px)}} .k17{animation:k17 8s ease-in-out infinite} @keyframes k18{0%{opacity:0} 0.0%{opacity:1} 50.0%{opacity:1} 51.5%{opacity:0} 100%{opacity:0}} .k18{animation:k18 8s linear infinite} @keyframes k19{0%{opacity:0} 48.5%{opacity:0} 50.0%{opacity:1} 100.0%{opacity:1}} .k19{animation:k19 8s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important} .fin{opacity:1!important}}</style><defs><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs><rect x="0" y="0" width="900" height="360" rx="10" fill="#0d1117" /><text x="24" y="40" fill="#e6edf3" font-size="15" font-weight="700">The loop</text><text x="24" y="58" fill="#8b949e" font-size="11">requestAnimationFrame runs it about 60 times a second</text><rect x="50" y="74" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k1" fill-opacity="0.22" /><rect x="50" y="74" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k2" fill-opacity="0.22" /><rect x="50" y="74" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k3" fill-opacity="0.22" /><rect x="50" y="74" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k4" fill-opacity="0.22" /><rect x="50" y="74" width="160" height="52" rx="8" fill="none" stroke="#30363d" stroke-width="1.5" /><text x="130" y="95" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">1. clear</text><text x="130" y="114" fill="#8b949e" font-size="10" text-anchor="middle">clearRect(0, 0, w, h)</text><rect x="240" y="74" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k5" fill-opacity="0.22" /><rect x="240" y="74" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k6" fill-opacity="0.22" /><rect x="240" y="74" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k7" fill-opacity="0.22" /><rect x="240" y="74" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k8 fin" fill-opacity="0.22" /><rect x="240" y="74" width="160" height="52" rx="8" fill="none" stroke="#30363d" stroke-width="1.5" /><text x="320" y="95" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">2. draw</text><text x="320" y="114" fill="#8b949e" font-size="10" text-anchor="middle">arc(x, 150, 20, ...)</text><rect x="240" y="204" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k9" fill-opacity="0.22" /><rect x="240" y="204" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k10" fill-opacity="0.22" /><rect x="240" y="204" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k11" fill-opacity="0.22" /><rect x="240" y="204" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k12" fill-opacity="0.22" /><rect x="240" y="204" width="160" height="52" rx="8" fill="none" stroke="#30363d" stroke-width="1.5" /><text x="320" y="225" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">3. move</text><text x="320" y="244" fill="#8b949e" font-size="10" text-anchor="middle">x += speed</text><rect x="50" y="204" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k13" fill-opacity="0.22" /><rect x="50" y="204" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k14" fill-opacity="0.22" /><rect x="50" y="204" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k15" fill-opacity="0.22" /><rect x="50" y="204" width="160" height="52" rx="8" fill="#e3b341" stroke="#e3b341" stroke-width="2" class="a k16" fill-opacity="0.22" /><rect x="50" y="204" width="160" height="52" rx="8" fill="none" stroke="#30363d" stroke-width="1.5" /><text x="130" y="225" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">4. next frame</text><text x="130" y="244" fill="#8b949e" font-size="10" text-anchor="middle">requestAnimationFrame(draw)</text><line x1="212" y1="100" x2="236" y2="100" stroke="#f0883e" stroke-width="2" marker-end="url(#orange)"/><line x1="320" y1="128" x2="320" y2="200" stroke="#f0883e" stroke-width="2" marker-end="url(#orange)"/><line x1="238" y1="230" x2="214" y2="230" stroke="#f0883e" stroke-width="2" marker-end="url(#orange)"/><line x1="130" y1="202" x2="130" y2="130" stroke="#f0883e" stroke-width="2" marker-end="url(#orange)"/><text x="225" y="178" fill="#8b949e" font-size="11" text-anchor="middle" font-style="italic">one frame</text><text x="470" y="40" fill="#e6edf3" font-size="15" font-weight="700">&lt;canvas&gt;</text><text x="470" y="58" fill="#8b949e" font-size="11">what the loop draws</text><rect x="470" y="70" width="400" height="220" rx="6" fill="#ffffff" stroke="#30363d" stroke-width="1.5" /><g class="k17"><circle cx="510" cy="180" r="20" fill="#388bfd"/></g><circle cx="560" cy="180" r="20" fill="#388bfd" fill-opacity="0.1"/><circle cx="600" cy="180" r="20" fill="#388bfd" fill-opacity="0.15000000000000002"/><circle cx="640" cy="180" r="20" fill="#388bfd" fill-opacity="0.2"/><text x="480" y="280" fill="#57606a" font-size="10" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">each frame is a still picture with a tiny change</text><text x="24" y="320" fill="#e6edf3" font-size="13" class="a k18">Wipe the frame, draw the ball a little further along, ask for the next frame.</text><text x="24" y="320" fill="#e6edf3" font-size="13" class="a k19 fin">Sixty still pictures a second. Your eye turns them into motion.</text><text x="24" y="342" fill="#8b949e" font-size="12">A keydown listener that changes speed changes the next frame. That is a game.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <title>How a page reacts: an event on an element runs the function attached to it, and the function changes the page</title>
  <rect width="760" height="330" rx="10" fill="#0d1117"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- 1 event -->
  <text x="30" y="40" fill="#e6edf3" font-weight="700" font-size="15">1. Something happens</text>
  <rect x="30" y="56" width="160" height="110" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="46" y="84" fill="#f0883e" font-weight="700">click</text>
  <text x="46" y="108" fill="#f0883e" font-weight="700">keydown</text>
  <text x="46" y="132" fill="#f0883e" font-weight="700">mousemove</text>
  <text x="46" y="156" fill="#f0883e" font-weight="700">a timer fires</text>

  <line x1="196" y1="111" x2="234" y2="111" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2 element + listener -->
  <text x="240" y="40" fill="#e6edf3" font-weight="700" font-size="15">2. On an element</text>
  <rect x="240" y="56" width="180" height="110" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <text x="256" y="84" fill="#79c0ff">&lt;button</text>
  <text x="256" y="106" fill="#79c0ff">  id="clicker"&gt;</text>
  <text x="256" y="134" fill="#8b949e" font-size="12">is listening for</text>
  <text x="256" y="154" fill="#8b949e" font-size="12">"click"</text>

  <line x1="426" y1="111" x2="464" y2="111" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3 function -->
  <text x="470" y="40" fill="#e6edf3" font-weight="700" font-size="15">3. Your function runs</text>
  <rect x="470" y="56" width="260" height="110" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="486" y="84" fill="#a371f7">() =&gt; {</text>
  <text x="502" y="108" fill="#e6edf3">clickCount += 1;</text>
  <text x="502" y="130" fill="#e6edf3">output.textContent =</text>
  <text x="518" y="150" fill="#e6edf3">clickCount + " clicks";</text>

  <!-- 4 page changes -->
  <line x1="600" y1="172" x2="600" y2="206" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="296" fill="#e6edf3" font-weight="700" font-size="15">4. The page changes</text>
  <rect x="470" y="212" width="260" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="246" fill="#3fb950" text-anchor="middle" font-weight="700">3 clicks</text>

  <text x="30" y="226" fill="#8b949e" font-size="12">Pick an element, name an event,</text>
  <text x="30" y="246" fill="#8b949e" font-size="12">attach a function. It runs every time.</text>
  <text x="30" y="280" fill="#8b949e" font-size="12">button.addEventListener("click", () =&gt; { ... });</text>
</svg>

<g class="k2"><rect x="196" y="135" width="52" height="22" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.5" class="a k3"/><text x="222" y="150" fill="#3fb950" font-size="9" font-weight="700" text-anchor="middle" class="a k3">package</text></g><rect x="608" y="262" width="268" height="52" rx="6" fill="#0b0f14" stroke="#30363d" stroke-width="1" /><text x="620" y="282" fill="#e6edf3" font-size="12">&gt; confetti()</text><text x="620" y="302" fill="#8b949e" font-size="9" class="a k4 fin">not your code, but on your page now</text><g class="k6"><rect x="757" y="280" width="7" height="4" rx="1" fill="#3fb950" class="a k5"/></g><g class="k8"><rect x="762" y="280" width="7" height="4" rx="1" fill="#e3b341" class="a k7"/></g><g class="k10"><rect x="752" y="280" width="7" height="4" rx="1" fill="#f0883e" class="a k9"/></g><g class="k12"><rect x="762" y="280" width="7" height="4" rx="1" fill="#79c0ff" class="a k11"/></g><g class="k14"><rect x="751" y="280" width="7" height="4" rx="1" fill="#a371f7" class="a k13"/></g><g class="k16"><rect x="767" y="280" width="7" height="4" rx="1" fill="#3fb950" class="a k15"/></g><g class="k18"><rect x="755" y="280" width="7" height="4" rx="1" fill="#e3b341" class="a k17"/></g><g class="k20"><rect x="756" y="280" width="7" height="4" rx="1" fill="#f0883e" class="a k19"/></g><g class="k22"><rect x="758" y="280" width="7" height="4" rx="1" fill="#79c0ff" class="a k21"/></g><g class="k24"><rect x="755" y="280" width="7" height="4" rx="1" fill="#a371f7" class="a k23"/></g><g class="k26"><rect x="770" y="280" width="7" height="4" rx="1" fill="#3fb950" class="a k25"/></g><g class="k28"><rect x="769" y="280" width="7" height="4" rx="1" fill="#e3b341" class="a k27"/></g><g class="k30"><rect x="762" y="280" width="7" height="4" rx="1" fill="#f0883e" class="a k29"/></g><g class="k32"><rect x="755" y="280" width="7" height="4" rx="1" fill="#79c0ff" class="a k31"/></g><g class="k34"><rect x="758" y="280" width="7" height="4" rx="1" fill="#a371f7" class="a k33"/></g><g class="k36"><rect x="759" y="280" width="7" height="4" rx="1" fill="#3fb950" class="a k35"/></g><text x="24" y="330" fill="#e6edf3" font-size="13" class="a k37">1. A package is a folder of code someone published for everyone to use.</text><text x="24" y="330" fill="#e6edf3" font-size="13" class="a k38">2. A CDN serves it to any browser at a fixed address, pinned to one version.</text><text x="24" y="330" fill="#e6edf3" font-size="13" class="a k39 fin">3. One script tag puts it in your tree. confetti() is now yours to call.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="300" rx="12" fill="#0d1117"/>
  <line x1="300" y1="24" x2="300" y2="276" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- left: plain variable -->
  <text x="24" y="40" fill="#f0883e" font-size="14" font-weight="700">Plain variable</text>
  <rect x="32" y="56" width="236" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="84" fill="#c9d1d9" font-size="14" font-family="ui-monospace, Menlo, monospace">let count = 5</text>

  <line x1="150" y1="104" x2="150" y2="150" stroke="#8b949e" stroke-width="2"/>
  <polygon points="145,150 150,159 155,150" fill="#8b949e"/>
  <text x="162" y="132" fill="#8b949e" font-size="12">refresh</text>

  <rect x="32" y="162" width="236" height="56" rx="8" fill="#21262d" stroke="#f85149"/>
  <text x="48" y="188" fill="#f85149" font-size="15" font-family="ui-monospace, Menlo, monospace">count = 0</text>
  <text x="48" y="208" fill="#8b949e" font-size="12">memory thrown away</text>

  <!-- right: localStorage -->
  <text x="330" y="40" fill="#3fb950" font-size="14" font-weight="700">localStorage</text>
  <rect x="330" y="56" width="246" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="346" y="84" fill="#c9d1d9" font-size="13" font-family="ui-monospace, Menlo, monospace">setItem("count", 5)</text>

  <rect x="346" y="110" width="214" height="52" rx="8" fill="#21262d" stroke="#3fb950"/>
  <text x="360" y="130" fill="#8b949e" font-size="10">notebook the browser keeps for this site</text>
  <text x="360" y="152" fill="#c9d1d9" font-size="15" font-family="ui-monospace, Menlo, monospace">count: 5</text>

  <line x1="453" y1="164" x2="453" y2="196" stroke="#8b949e" stroke-width="2"/>
  <polygon points="448,196 453,205 458,196" fill="#8b949e"/>
  <text x="465" y="184" fill="#8b949e" font-size="12">refresh</text>

  <rect x="346" y="208" width="214" height="52" rx="8" fill="#21262d" stroke="#3fb950"/>
  <text x="360" y="234" fill="#3fb950" font-size="15" font-family="ui-monospace, Menlo, monospace">count = 5</text>
  <text x="360" y="252" fill="#8b949e" font-size="12">getItem reads it back</text>
</svg>

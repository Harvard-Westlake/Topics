<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="470" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">Collision resolution by chaining: one bucket, a list of key-value pairs</text>
  <text x="75" y="80" fill="#8b949e" font-size="14" font-weight="700" text-anchor="middle">Index</text>
  <text x="330" y="80" fill="#8b949e" font-size="14" font-weight="700">Lists of Key, Value pairs</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <g id="node">
      <rect width="78" height="20" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
      <text x="39" y="14" fill="#79c0ff" font-size="11" text-anchor="middle" font-family="Consolas, Menlo, monospace">Key, Value</text>
    </g>
  </defs>
  <g font-size="12" font-family="Consolas, Menlo, monospace">
    <!-- rows: y = 100 + 28*i -->
    <!-- row 0: 3 nodes -->
    <rect x="50" y="100" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="114" fill="#8b949e" text-anchor="middle">0</text>
    <line x1="100" y1="110" x2="130" y2="110" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="100"/><line x1="210" y1="110" x2="240" y2="110" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="242" y="100"/><line x1="320" y1="110" x2="350" y2="110" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="352" y="100"/><line x1="430" y1="110" x2="460" y2="110" stroke="#8b949e" marker-end="url(#arr)"/><text x="466" y="115" fill="#e3b341" font-size="14">∅</text>
    <!-- row 1: 2 nodes -->
    <rect x="50" y="128" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="142" fill="#8b949e" text-anchor="middle">1</text>
    <line x1="100" y1="138" x2="130" y2="138" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="128"/><line x1="210" y1="138" x2="240" y2="138" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="242" y="128"/><line x1="320" y1="138" x2="350" y2="138" stroke="#8b949e" marker-end="url(#arr)"/><text x="356" y="143" fill="#e3b341" font-size="14">∅</text>
    <!-- row 2: 1 node -->
    <rect x="50" y="156" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="170" fill="#8b949e" text-anchor="middle">2</text>
    <line x1="100" y1="166" x2="130" y2="166" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="156"/><line x1="210" y1="166" x2="240" y2="166" stroke="#8b949e" marker-end="url(#arr)"/><text x="246" y="171" fill="#e3b341" font-size="14">∅</text>
    <!-- row 3: 1 node -->
    <rect x="50" y="184" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="198" fill="#8b949e" text-anchor="middle">3</text>
    <line x1="100" y1="194" x2="130" y2="194" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="184"/><line x1="210" y1="194" x2="240" y2="194" stroke="#8b949e" marker-end="url(#arr)"/><text x="246" y="199" fill="#e3b341" font-size="14">∅</text>
    <!-- row 4: 1 node -->
    <rect x="50" y="212" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="226" fill="#8b949e" text-anchor="middle">4</text>
    <line x1="100" y1="222" x2="130" y2="222" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="212"/><line x1="210" y1="222" x2="240" y2="222" stroke="#8b949e" marker-end="url(#arr)"/><text x="246" y="227" fill="#e3b341" font-size="14">∅</text>
    <!-- row 5: 3 nodes -->
    <rect x="50" y="240" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="254" fill="#8b949e" text-anchor="middle">5</text>
    <line x1="100" y1="250" x2="130" y2="250" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="240"/><line x1="210" y1="250" x2="240" y2="250" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="242" y="240"/><line x1="320" y1="250" x2="350" y2="250" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="352" y="240"/><line x1="430" y1="250" x2="460" y2="250" stroke="#8b949e" marker-end="url(#arr)"/><text x="466" y="255" fill="#e3b341" font-size="14">∅</text>
    <!-- row 6: 2 nodes -->
    <rect x="50" y="268" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="282" fill="#8b949e" text-anchor="middle">6</text>
    <line x1="100" y1="278" x2="130" y2="278" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="268"/><line x1="210" y1="278" x2="240" y2="278" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="242" y="268"/><line x1="320" y1="278" x2="350" y2="278" stroke="#8b949e" marker-end="url(#arr)"/><text x="356" y="283" fill="#e3b341" font-size="14">∅</text>
    <!-- row 7: 1 node -->
    <rect x="50" y="296" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="310" fill="#8b949e" text-anchor="middle">7</text>
    <line x1="100" y1="306" x2="130" y2="306" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="296"/><line x1="210" y1="306" x2="240" y2="306" stroke="#8b949e" marker-end="url(#arr)"/><text x="246" y="311" fill="#e3b341" font-size="14">∅</text>
    <!-- row 8: 1 node -->
    <rect x="50" y="324" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="338" fill="#8b949e" text-anchor="middle">8</text>
    <line x1="100" y1="334" x2="130" y2="334" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="324"/><line x1="210" y1="334" x2="240" y2="334" stroke="#8b949e" marker-end="url(#arr)"/><text x="246" y="339" fill="#e3b341" font-size="14">∅</text>
    <!-- row 9: 1 node -->
    <rect x="50" y="352" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="366" fill="#8b949e" text-anchor="middle">9</text>
    <line x1="100" y1="362" x2="130" y2="362" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="352"/><line x1="210" y1="362" x2="240" y2="362" stroke="#8b949e" marker-end="url(#arr)"/><text x="246" y="367" fill="#e3b341" font-size="14">∅</text>
    <!-- row 10: empty -->
    <rect x="50" y="380" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="394" fill="#8b949e" text-anchor="middle">10</text>
    <line x1="100" y1="390" x2="130" y2="390" stroke="#8b949e" marker-end="url(#arr)"/><text x="136" y="395" fill="#e3b341" font-size="14">∅</text>
    <!-- row 11: 2 nodes -->
    <rect x="50" y="408" width="50" height="20" rx="3" fill="#161b22" stroke="#30363d"/><text x="75" y="422" fill="#8b949e" text-anchor="middle">11</text>
    <line x1="100" y1="418" x2="130" y2="418" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="132" y="408"/><line x1="210" y1="418" x2="240" y2="418" stroke="#8b949e" marker-end="url(#arr)"/>
    <use href="#node" x="242" y="408"/><line x1="320" y1="418" x2="350" y2="418" stroke="#8b949e" marker-end="url(#arr)"/><text x="356" y="423" fill="#e3b341" font-size="14">∅</text>
  </g>
  <text x="30" y="455" fill="#8b949e" font-size="13">Buckets 0 and 5 each hold three colliding pairs — every lookup there must walk the list, and O(1) slips away.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="440" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">Collisions come sooner than you think (N = 365 birthdays)</text>
  <text x="30" y="66" fill="#79c0ff" font-size="14" font-family="Consolas, Menlo, monospace">P = 1 − e^( −k(k−1) / 2N )</text>

  <!-- axes -->
  <line x1="90" y1="370" x2="700" y2="370" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="90" y1="370" x2="90" y2="90" stroke="#8b949e" stroke-width="1.5"/>
  <text x="395" y="405" fill="#8b949e" font-size="13" text-anchor="middle">k — people in the room</text>
  <text x="52" y="95" fill="#8b949e" font-size="12">P</text>
  <text x="80" y="374" fill="#8b949e" font-size="11" text-anchor="end">0</text>
  <text x="80" y="235" fill="#8b949e" font-size="11" text-anchor="end">0.5</text>
  <text x="80" y="100" fill="#8b949e" font-size="11" text-anchor="end">1.0</text>
  <text x="190" y="388" fill="#8b949e" font-size="11" text-anchor="middle">10</text>
  <text x="320" y="388" fill="#8b949e" font-size="11" text-anchor="middle">23</text>
  <text x="490" y="388" fill="#8b949e" font-size="11" text-anchor="middle">40</text>
  <text x="690" y="388" fill="#8b949e" font-size="11" text-anchor="middle">60</text>

  <!-- gridline at 0.5 -->
  <line x1="90" y1="230" x2="700" y2="230" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- curve: P(k)=1-e^(-k(k-1)/730), x=90+10k, y=370-280P -->
  <path d="M 90 370 L 140 362 L 190 338 L 240 300 L 290 255 L 320 230 L 390 175 L 440 138 L 490 123 L 540 111 L 590 105 L 640 100 L 690 92"
        fill="none" stroke="#388bfd" stroke-width="3.5" stroke-linecap="round"/>

  <!-- marker at 23 -->
  <line x1="320" y1="370" x2="320" y2="230" stroke="#e3b341" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="320" cy="230" r="8" fill="#e3b341"/>
  <text x="336" y="222" fill="#e3b341" font-size="13" font-weight="700">just 23 people → 50% chance of a shared birthday</text>

  <!-- marker at 60 -->
  <circle cx="690" cy="92" r="7" fill="#3fb950"/>
  <text x="680" y="120" fill="#3fb950" font-size="12" text-anchor="end">60 people → 99%+</text>

  <text x="30" y="428" fill="#8b949e" font-size="13">What matters is pairs, not people: k people form k(k−1)/2 chances to collide — that's why P races upward.</text>
</svg>

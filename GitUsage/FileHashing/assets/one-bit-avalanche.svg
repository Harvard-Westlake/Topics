<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="420" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">The avalanche effect — one character in, 64 characters out</text>

  <!-- input 1 -->
  <rect x="30" y="80" width="300" height="56" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="48" y="114" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">"<tspan fill="#3fb950" font-weight="700">G</tspan>it is a content tracker"</text>

  <!-- input 2 -->
  <rect x="30" y="280" width="300" height="56" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="48" y="314" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">"<tspan fill="#f85149" font-weight="700">g</tspan>it is a content tracker"</text>

  <text x="180" y="215" fill="#e3b341" font-size="13" text-anchor="middle" font-weight="600">only difference: one letter's case</text>

  <!-- SHA box -->
  <rect x="370" y="170" width="110" height="76" rx="8" fill="#161b22" stroke="#79c0ff"/>
  <text x="425" y="203" fill="#79c0ff" font-size="14" font-weight="700" text-anchor="middle">SHA-256</text>
  <text x="425" y="226" fill="#8b949e" font-size="11" text-anchor="middle">fingerprint</text>

  <line x1="330" y1="108" x2="370" y2="185" stroke="#8b949e" stroke-width="2.5"/>
  <line x1="330" y1="308" x2="370" y2="230" stroke="#8b949e" stroke-width="2.5"/>
  <line x1="480" y1="185" x2="520" y2="108" stroke="#8b949e" stroke-width="2.5"/>
  <line x1="480" y1="230" x2="520" y2="308" stroke="#8b949e" stroke-width="2.5"/>

  <!-- output 1 -->
  <rect x="520" y="66" width="235" height="84" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="538" y="94" fill="#3fb950" font-size="12" font-family="Consolas, Menlo, monospace">f2ad2d87081969322d259fb0</text>
  <text x="538" y="114" fill="#3fb950" font-size="12" font-family="Consolas, Menlo, monospace">c69fd8286a1d3890b56f08a6</text>
  <text x="538" y="134" fill="#3fb950" font-size="12" font-family="Consolas, Menlo, monospace">475081f80d027534</text>

  <!-- output 2 -->
  <rect x="520" y="266" width="235" height="84" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="538" y="294" fill="#f85149" font-size="12" font-family="Consolas, Menlo, monospace">919f031a8a152df2195a7cea</text>
  <text x="538" y="314" fill="#f85149" font-size="12" font-family="Consolas, Menlo, monospace">b77e4bf44fd8566a161acdbb</text>
  <text x="538" y="334" fill="#f85149" font-size="12" font-family="Consolas, Menlo, monospace">6545ba328b70486f</text>

  <text x="640" y="215" fill="#e3b341" font-size="13" text-anchor="middle" font-weight="600">nothing in common</text>

  <text x="30" y="392" fill="#8b949e" font-size="13">These are the real SHA-256 values — run the activity and you will get exactly these on your own machine. That's determinism.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="420" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">Sizing a hash table: how many buckets N keep k items (almost) collision-free?</text>

  <!-- inputs -->
  <rect x="40" y="90" width="190" height="60" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="135" y="115" fill="#e3b341" font-size="14" font-weight="700" text-anchor="middle">k = items to store</text>
  <text x="135" y="137" fill="#8b949e" font-size="12" text-anchor="middle">students, IDs, grains of sand...</text>

  <rect x="40" y="170" width="190" height="60" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="135" y="195" fill="#e3b341" font-size="14" font-weight="700" text-anchor="middle">P = desired chance of</text>
  <text x="135" y="215" fill="#e3b341" font-size="14" font-weight="700" text-anchor="middle">NO collision (e.g. 0.99)</text>

  <!-- formula box -->
  <rect x="290" y="105" width="210" height="110" rx="8" fill="#1f6feb" stroke="#388bfd" stroke-width="2"/>
  <text x="395" y="150" fill="#e6edf3" font-size="20" text-anchor="middle" font-family="Consolas, Menlo, monospace">N ≥ −k(k−1)</text>
  <line x1="330" y1="160" x2="470" y2="160" stroke="#e6edf3" stroke-width="2"/>
  <text x="395" y="190" fill="#e6edf3" font-size="20" text-anchor="middle" font-family="Consolas, Menlo, monospace">2 ln(P)</text>

  <!-- output -->
  <rect x="560" y="120" width="170" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="645" y="152" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">N = buckets needed</text>
  <text x="645" y="178" fill="#8b949e" font-size="12" text-anchor="middle">grows like k² — fast</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M 230 120 L 288 145"/>
    <path d="M 230 200 L 288 175"/>
    <path d="M 500 160 L 558 160"/>
  </g>

  <!-- worked rows -->
  <text x="40" y="270" fill="#e6edf3" font-size="14" font-weight="700">Already worked in the lesson</text>
  <g font-size="13" font-family="Consolas, Menlo, monospace">
    <text x="40" y="296" fill="#e3b341">k = 30 students</text>
    <text x="230" y="296" fill="#8b949e">P = 0.99   (1% collision)</text>
    <text x="500" y="296" fill="#3fb950">→ N ≈ 43,282 lockers</text>
    <text x="40" y="320" fill="#e3b341">k = 1,000 students</text>
    <text x="230" y="320" fill="#8b949e">P = 0.995  (0.5% collision)</text>
    <text x="500" y="320" fill="#3fb950">→ N ≈ 99,650,041 lockers</text>
  </g>

  <text x="40" y="362" fill="#e6edf3" font-size="14" font-weight="700">Your turn (with a partner)</text>
  <g font-size="13" font-family="Consolas, Menlo, monospace" fill="#79c0ff">
    <text x="40" y="388">k = 100,000 employees</text>
    <text x="240" y="388">k = 8,000,000,000 humans</text>
    <text x="470" y="388">k = 2^62.72 grains · 2^73.08 stars</text>
  </g>
</svg>

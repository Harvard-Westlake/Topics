<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="400" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">Same content → same ID, on machines that never spoke</text>

  <!-- machine A -->
  <rect x="40" y="80" width="280" height="130" rx="8" fill="#161b22" stroke="#79c0ff"/>
  <text x="58" y="108" fill="#79c0ff" font-size="13" font-weight="700">Your laptop</text>
  <text x="58" y="135" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">echo "hello git" > secret.txt</text>
  <text x="58" y="158" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">git hash-object secret.txt</text>
  <text x="58" y="188" fill="#8b949e" font-size="12">no internet needed, no repo needed</text>

  <!-- machine B -->
  <rect x="460" y="80" width="280" height="130" rx="8" fill="#161b22" stroke="#a371f7"/>
  <text x="478" y="108" fill="#a371f7" font-size="13" font-weight="700">Your classmate's laptop</text>
  <text x="478" y="135" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">echo "hello git" > secret.txt</text>
  <text x="478" y="158" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">git hash-object secret.txt</text>
  <text x="478" y="188" fill="#8b949e" font-size="12">different machine, different user</text>

  <!-- arrows to shared ID -->
  <line x1="180" y1="210" x2="330" y2="285" stroke="#8b949e" stroke-width="2.5"/>
  <line x1="600" y1="210" x2="450" y2="285" stroke="#8b949e" stroke-width="2.5"/>

  <rect x="120" y="290" width="540" height="60" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="390" y="316" fill="#3fb950" font-size="14" font-family="Consolas, Menlo, monospace" text-anchor="middle">8d0e41234f24b6da002d962a26c2495ea16a425f</text>
  <text x="390" y="338" fill="#8b949e" font-size="12" text-anchor="middle">identical — because the ID is computed FROM the content, not assigned to it</text>

  <text x="30" y="382" fill="#8b949e" font-size="13">This is exactly how commit IDs work: every object in .git/objects is filed under the hash of its own content.</text>
</svg>

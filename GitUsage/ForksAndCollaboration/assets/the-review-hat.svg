<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="380" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">A pull request is a conversation, not a submission</text>

  <rect x="30" y="80" width="180" height="70" rx="8" fill="#161b22" stroke="#a371f7"/>
  <text x="120" y="108" fill="#a371f7" font-size="13" font-weight="700" text-anchor="middle">1 · Author</text>
  <text x="120" y="130" fill="#e6edf3" font-size="12" text-anchor="middle">opens the PR</text>

  <line x1="210" y1="115" x2="285" y2="115" stroke="#8b949e" stroke-width="2.5"/>
  <polygon points="285,115 275,109 275,121" fill="#8b949e"/>

  <rect x="290" y="80" width="200" height="70" rx="8" fill="#161b22" stroke="#79c0ff"/>
  <text x="390" y="108" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle">2 · Reviewer</text>
  <text x="390" y="130" fill="#e6edf3" font-size="12" text-anchor="middle">reads every changed line</text>

  <line x1="490" y1="115" x2="565" y2="115" stroke="#8b949e" stroke-width="2.5"/>
  <polygon points="565,115 555,109 555,121" fill="#8b949e"/>

  <rect x="570" y="80" width="180" height="70" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="660" y="108" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">approve ✓</text>
  <text x="660" y="130" fill="#e6edf3" font-size="12" text-anchor="middle">merge into main</text>

  <!-- request changes loop -->
  <line x1="390" y1="150" x2="390" y2="215" stroke="#e3b341" stroke-width="2.5"/>
  <polygon points="390,215 384,205 396,205" fill="#e3b341"/>
  <rect x="290" y="220" width="200" height="70" rx="8" fill="#161b22" stroke="#e3b341"/>
  <text x="390" y="248" fill="#e3b341" font-size="13" font-weight="700" text-anchor="middle">request changes</text>
  <text x="390" y="270" fill="#e6edf3" font-size="12" text-anchor="middle">comments on specific lines</text>

  <line x1="290" y1="255" x2="120" y2="255" stroke="#8b949e" stroke-width="2.5"/>
  <polygon points="120,255 130,249 130,261" fill="#8b949e"/>
  <rect x="30" y="220" width="180" height="70" rx="8" fill="#161b22" stroke="#a371f7"/>
  <text x="120" y="248" fill="#a371f7" font-size="13" font-weight="700" text-anchor="middle">3 · Author fixes</text>
  <text x="120" y="270" fill="#e6edf3" font-size="12" text-anchor="middle">pushes to the SAME branch</text>

  <line x1="120" y1="220" x2="120" y2="150" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polygon points="120,150 114,160 126,160" fill="#8b949e"/>
  <text x="132" y="190" fill="#8b949e" font-size="11">the PR updates automatically — no new PR needed</text>

  <text x="30" y="345" fill="#8b949e" font-size="13">The loop repeats until the reviewer is satisfied. On real projects, several rounds is normal — not a failure.</text>
</svg>

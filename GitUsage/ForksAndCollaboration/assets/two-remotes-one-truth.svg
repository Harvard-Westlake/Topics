<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="420" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">Your clone tracks two remotes with very different rules</text>

  <!-- upstream -->
  <rect x="50" y="80" width="290" height="80" rx="8" fill="#161b22" stroke="#388bfd"/>
  <text x="68" y="108" fill="#388bfd" font-size="13" font-weight="700">upstream</text>
  <text x="68" y="130" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">octocat/Spoon-Knife</text>
  <text x="68" y="149" fill="#8b949e" font-size="12">the original — you can only read it</text>

  <!-- origin -->
  <rect x="420" y="80" width="290" height="80" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="438" y="108" fill="#3fb950" font-size="13" font-weight="700">origin</text>
  <text x="438" y="130" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">YOU/Spoon-Knife</text>
  <text x="438" y="149" fill="#8b949e" font-size="12">your fork — you own it</text>

  <!-- fork copy arrow -->
  <line x1="340" y1="120" x2="420" y2="120" stroke="#a371f7" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="380" y="110" fill="#a371f7" font-size="11" text-anchor="middle">forked from</text>

  <!-- laptop -->
  <rect x="255" y="260" width="250" height="80" rx="8" fill="#161b22" stroke="#e6edf3"/>
  <text x="380" y="290" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">your laptop clone</text>
  <text x="380" y="315" fill="#8b949e" font-size="12" text-anchor="middle">git remote -v shows both</text>

  <!-- arrows -->
  <line x1="195" y1="160" x2="290" y2="260" stroke="#388bfd" stroke-width="3"/>
  <text x="190" y="225" fill="#388bfd" font-size="12">git fetch upstream ↓</text>
  <line x1="310" y1="262" x2="215" y2="168" stroke="#f85149" stroke-width="2.5" stroke-dasharray="3 4"/>
  <text x="150" y="248" fill="#f85149" font-size="12">push ✖ no permission</text>

  <line x1="565" y1="160" x2="470" y2="260" stroke="#3fb950" stroke-width="3"/>
  <line x1="490" y1="260" x2="585" y2="160" stroke="#3fb950" stroke-width="3"/>
  <text x="560" y="225" fill="#3fb950" font-size="12">git push ↑  git fetch ↓</text>

  <text x="30" y="390" fill="#8b949e" font-size="13">You pull the truth down from upstream, and push your work up to origin — never the other way around.</text>
</svg>

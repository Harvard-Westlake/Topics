<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 310" width="1140" height="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">
  <title>GitKraken's Create Pull Request form: From Repo is their fork and their branch, the arrow points to To Repo, your repository and main</title>
  <rect width="1140" height="310" rx="8" fill="#1e2228"/>
  <!-- From side -->
  <text x="18" y="52" fill="#c9d1d9" font-size="22">From Repo</text>
  <rect x="14" y="70" width="500" height="70" rx="6" fill="#2b3038" stroke="#4c8bf5" stroke-width="2"/>
  <text x="40" y="113" fill="#e6edf3">THEM/YOUR-REPO</text>
  <line x1="462" y1="78" x2="462" y2="132" stroke="#3b414b" stroke-width="1"/>
  <text x="488" y="112" fill="#c9d1d9" font-size="20" text-anchor="middle">&#8964;</text>
  <text x="18" y="185" fill="#c9d1d9" font-size="22">Branch</text>
  <rect x="14" y="203" width="494" height="66" rx="6" fill="#2b3038" stroke="#3b414b" stroke-width="2"/>
  <text x="40" y="244" fill="#e6edf3">their-branch</text>
  <line x1="456" y1="211" x2="456" y2="261" stroke="#3b414b" stroke-width="1"/>
  <text x="482" y="243" fill="#c9d1d9" font-size="20" text-anchor="middle">&#8964;</text>
  <!-- arrow -->
  <path d="M556,128 L574,128 L574,118 L592,133 L574,148 L574,138 L556,138 z" fill="#8b949e"/>
  <!-- To side -->
  <text x="625" y="52" fill="#c9d1d9" font-size="22">To Repo</text>
  <rect x="621" y="70" width="500" height="70" rx="6" fill="#2b3038" stroke="#4c8bf5" stroke-width="2"/>
  <text x="647" y="113" fill="#e6edf3">YOU/YOUR-REPO</text>
  <line x1="1069" y1="78" x2="1069" y2="132" stroke="#3b414b" stroke-width="1"/>
  <text x="1095" y="112" fill="#c9d1d9" font-size="20" text-anchor="middle">&#8964;</text>
  <text x="625" y="185" fill="#c9d1d9" font-size="22">Branch</text>
  <rect x="621" y="203" width="500" height="66" rx="6" fill="#2b3038" stroke="#4c8bf5" stroke-width="2"/>
  <text x="647" y="244" fill="#e6edf3">main</text>
  <line x1="1069" y1="211" x2="1069" y2="261" stroke="#3b414b" stroke-width="1"/>
  <text x="1095" y="243" fill="#c9d1d9" font-size="20" text-anchor="middle">&#8964;</text>
</svg>

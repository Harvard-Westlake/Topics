<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="380" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">Three tools, one question: what access do you have?</text>

  <!-- Branch -->
  <rect x="30" y="70" width="225" height="240" rx="8" fill="#161b22" stroke="#388bfd"/>
  <text x="142" y="100" fill="#388bfd" font-size="14" font-weight="700" text-anchor="middle">BRANCH</text>
  <rect x="55" y="120" width="175" height="105" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="142" y="142" fill="#8b949e" font-size="12" text-anchor="middle">you/your-repo</text>
  <line x1="75" y1="170" x2="210" y2="170" stroke="#388bfd" stroke-width="3"/>
  <line x1="120" y1="170" x2="200" y2="200" stroke="#a371f7" stroke-width="3"/>
  <text x="142" y="255" fill="#e6edf3" font-size="12" text-anchor="middle">a second timeline inside</text>
  <text x="142" y="273" fill="#e6edf3" font-size="12" text-anchor="middle">a repo you already own</text>
  <text x="142" y="296" fill="#79c0ff" font-size="12" text-anchor="middle">access: it's yours</text>

  <!-- Collaborator -->
  <rect x="278" y="70" width="225" height="240" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="390" y="100" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">COLLABORATOR</text>
  <rect x="303" y="120" width="175" height="105" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="390" y="142" fill="#8b949e" font-size="12" text-anchor="middle">teammate/shared-repo</text>
  <circle cx="345" cy="185" r="12" fill="#3fb950"/>
  <circle cx="435" cy="185" r="12" fill="#79c0ff"/>
  <text x="345" y="189" fill="#0d1117" font-size="11" text-anchor="middle" font-weight="700">you</text>
  <text x="435" y="189" fill="#0d1117" font-size="10" text-anchor="middle" font-weight="700">them</text>
  <text x="390" y="255" fill="#e6edf3" font-size="12" text-anchor="middle">owner invites you —</text>
  <text x="390" y="273" fill="#e6edf3" font-size="12" text-anchor="middle">everyone pushes to one repo</text>
  <text x="390" y="296" fill="#79c0ff" font-size="12" text-anchor="middle">access: granted by invite</text>

  <!-- Fork -->
  <rect x="526" y="70" width="225" height="240" rx="8" fill="#161b22" stroke="#a371f7"/>
  <text x="638" y="100" fill="#a371f7" font-size="14" font-weight="700" text-anchor="middle">FORK</text>
  <rect x="551" y="115" width="175" height="48" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="638" y="144" fill="#8b949e" font-size="12" text-anchor="middle">stranger/project</text>
  <rect x="551" y="185" width="175" height="48" rx="6" fill="#0d1117" stroke="#a371f7"/>
  <text x="638" y="214" fill="#e6edf3" font-size="12" text-anchor="middle">you/project (fork)</text>
  <line x1="600" y1="163" x2="600" y2="185" stroke="#a371f7" stroke-width="2.5"/>
  <text x="590" y="178" fill="#a371f7" font-size="10" text-anchor="end">copy</text>
  <line x1="676" y1="185" x2="676" y2="163" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="686" y="178" fill="#3fb950" font-size="10">PR back</text>
  <text x="638" y="255" fill="#e6edf3" font-size="12" text-anchor="middle">a full copy under YOUR</text>
  <text x="638" y="273" fill="#e6edf3" font-size="12" text-anchor="middle">account — propose changes back</text>
  <text x="638" y="296" fill="#79c0ff" font-size="12" text-anchor="middle">access: none needed</text>

  <text x="30" y="348" fill="#8b949e" font-size="13">Wrong tool, wrong outcome: you can't branch in a repo you can't push to — and forking your own repo just clutters your account.</text>
</svg>

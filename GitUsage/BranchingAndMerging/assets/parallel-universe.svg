<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="400" rx="10" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="17" font-weight="700">One folder, two universes</text>

  <!-- commit graph -->
  <text x="30" y="120" fill="#388bfd" font-size="13" font-weight="600">main</text>
  <line x1="80" y1="140" x2="240" y2="140" stroke="#388bfd" stroke-width="3"/>
  <circle cx="100" cy="140" r="9" fill="#388bfd"/>
  <circle cx="200" cy="140" r="9" fill="#388bfd"/>
  <text x="100" y="170" fill="#8b949e" font-size="12" text-anchor="middle">A</text>
  <text x="200" y="170" fill="#8b949e" font-size="12" text-anchor="middle">B</text>

  <line x1="200" y1="140" x2="300" y2="250" stroke="#a371f7" stroke-width="3"/>
  <circle cx="300" cy="250" r="9" fill="#a371f7"/>
  <text x="300" y="282" fill="#8b949e" font-size="12" text-anchor="middle">C</text>
  <text x="185" y="310" fill="#a371f7" font-size="13" font-weight="600">experiment branch</text>
  <text x="185" y="330" fill="#8b949e" font-size="12">universe-b.txt committed here</text>

  <!-- working directory panels -->
  <rect x="420" y="70" width="310" height="120" rx="8" fill="#161b22" stroke="#388bfd"/>
  <text x="438" y="97" fill="#79c0ff" font-size="13" font-family="Consolas, Menlo, monospace">git checkout main</text>
  <text x="438" y="122" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">$ ls</text>
  <text x="438" y="145" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">clue.txt</text>
  <text x="438" y="172" fill="#f85149" font-size="12">universe-b.txt is not part of this reality</text>

  <rect x="420" y="215" width="310" height="120" rx="8" fill="#161b22" stroke="#a371f7"/>
  <text x="438" y="242" fill="#79c0ff" font-size="13" font-family="Consolas, Menlo, monospace">git checkout experiment</text>
  <text x="438" y="267" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">$ ls</text>
  <text x="438" y="290" fill="#e6edf3" font-size="13" font-family="Consolas, Menlo, monospace">clue.txt  <tspan fill="#3fb950">universe-b.txt</tspan></text>
  <text x="438" y="317" fill="#3fb950" font-size="12">…and it comes right back</text>

  <text x="30" y="372" fill="#8b949e" font-size="13">The file never left your computer — while you stand on main it waits inside .git/, ready to reappear.</text>
</svg>
